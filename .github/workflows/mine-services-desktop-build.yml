name: Mine Services Windows Desktop Installer
# Rebuild installer to validate the latest v43-workspace hydrology overlay fix

on:
  workflow_dispatch:
  push:
    branches:
      - v42-workspace
      - v43-workspace
    paths:
      - '.github/workflows/mine-services-desktop-build.yml'
      - 'lithosite-Mine-Services/**'
      - 'Engine_Share/Security_Guard/Host_Guard/**'

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.17"
          cache: pip
          cache-dependency-path: lithosite-Mine-Services/packaging/requirements-build.txt

      - name: Install packaging dependencies
        working-directory: lithosite-Mine-Services
        run: python -m pip install --upgrade pip && python -m pip install -r packaging/requirements-build.txt

      - name: Obtain official WebView2 offline runtime installer
        shell: pwsh
        working-directory: lithosite-Mine-Services
        run: |
          New-Item -ItemType Directory -Force packaging/redist | Out-Null
          $runtime = Join-Path (Get-Location) "packaging/redist/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2124701" -OutFile $runtime
          $runtimeInfo = Get-Item $runtime
          if ($runtimeInfo.Length -lt 50MB) {
            throw "Downloaded WebView2 package is too small to be the Evergreen Standalone Installer."
          }
          $signature = Get-AuthenticodeSignature $runtime
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "WebView2 installer signature could not be validated as Microsoft-signed."
          }

      - name: Build standalone desktop application
        working-directory: lithosite-Mine-Services
        run: python -m PyInstaller --clean --noconfirm packaging/mine-services.spec

      - name: Verify operational workbook is not bundled
        shell: pwsh
        working-directory: lithosite-Mine-Services
        run: |
          $bundledDatabase = Get-ChildItem -Path dist/LithositeMineServices -Recurse -File |
            Where-Object { $_.Name -eq "Mine-Services-Database-A3.xlsx" }
          if ($bundledDatabase) { throw "Operational database must not be included in the installer." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        working-directory: lithosite-Mine-Services
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" "Inno Setup 6/ISCC.exe"
          & $iscc "packaging/LithositeMineServices.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lithosite-Mine-Services-Windows-Installer
          path: lithosite-Mine-Services/dist-installer/*.exe
          if-no-files-found: error
          retention-days: 14
