name: Mine Services Full Pytest

on:
  push:
    branches:
      - v40-workspace
  pull_request:
    branches:
      - main
    paths:
      - "lithosite-Mine-Services/**"
      - ".github/workflows/mine-services-pytest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Full test suite (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lithosite-Mine-Services
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lithosite-Mine-Services/pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run full pytest suite
        run: python -m pytest -q
