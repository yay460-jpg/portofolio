<style>
  * { -webkit-tap-highlight-color: transparent; }
  /* FIX (4 Sep, revisi ke-2): Fix pertama (overscroll-behavior di html/.app-main) TERNYATA
  BELUM CUKUP -- gestur pull-to-refresh browser masih bisa "menarik" dokumen di level
  html/body itu sendiri (blm dikunci posisinya), DAN .app-shell pakai 100dvh (tinggi yg
  berubah2 ikut address bar browser muncul/hilang saat gestur berlangsung) -- kombinasi
  keduanya bikin nav bar bawah kelihatan "terdorong turun" sesaat. Fix sekarang: html/body
  DIKUNCI TOTAL (position:fixed + inset:0 + overflow:hidden) supaya dokumen level luar
  TIDAK PERNAH bisa digeser/melenting sama sekali oleh gestur apa pun -- satu2nya yg boleh
  scroll cuma .app-main di dalamnya (scroll internal, tidak memengaruhi dokumen luar).
  100dvh diganti 100svh (stable viewport height, TIDAK ikut berubah pas address bar
  muncul/hilang) supaya app-shell tidak "loncat" ukurannya di tengah gestur. */
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
  }
  body { font-family: 'Inter', -apple-system, sans-serif; background:#070b1c; }
  .app-shell { max-width: 480px; margin: 0 auto; height: 100svh; height: calc(var(--mg1-vvh, 100svh)); position: relative; background: #070b1c; display: flex; flex-direction: column; overflow: hidden; }
  .app-main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; background: #070b1c; overscroll-behavior: contain; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .card { background: rgba(15,23,42,0.55); border: 1px solid rgba(255,255,255,0.06); }
  .glow-gold { box-shadow: 0 0 24px rgba(37,99,235,0.18); }
  /* V14.14 -- Lithosite-Oneplus boot visual, adapted from uploaded source artifact. */
  .mg1-boot { position:relative; width:100%; height:100%; min-height:100svh; overflow:hidden; background:#070b1c; color:#fff; display:flex; align-items:center; justify-content:center; isolation:isolate; }
  .mg1-boot::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.32; background:radial-gradient(circle at 50% 42%, rgba(37,99,235,.14), transparent 34%), radial-gradient(circle at 20% 80%, rgba(15,23,42,.72), transparent 42%); }
  .mg1-boot::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.16; background:repeating-radial-gradient(ellipse at 20% 90%, transparent 0 22px, rgba(96,165,250,.10) 23px 24px, transparent 25px 48px); mask-image:linear-gradient(to top, rgba(0,0,0,.9), transparent 72%); }
  .mg1-boot-glow { position:absolute; width:320px; height:320px; border-radius:50%; filter:blur(80px); opacity:.18; pointer-events:none; }
  .mg1-boot-glow-blue { background:#38bdf8; top:-110px; left:50%; transform:translateX(-50%); }
  .mg1-boot-glow-orange { background:#f97316; right:-130px; bottom:-120px; }
  .mg1-boot-orbit { position:absolute; left:50%; top:50%; width:170px; height:170px; transform:translate(-50%,-50%); border-radius:50%; animation:mg1BootOrbit 2.4s linear infinite; }
  .mg1-orbit-dot { position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px; border-radius:50%; box-shadow:0 0 18px currentColor,0 0 36px currentColor; }
  .mg1-orbit-blue { background:#38bdf8; color:#38bdf8; transform:translateX(78px); }
  .mg1-orbit-orange { background:#f97316; color:#f97316; transform:translateX(-78px); }
  .mg1-boot-logo-wrap { position:absolute; left:50%; top:50%; width:112px; height:112px; transform:translate(-50%,-50%) scale(.25); opacity:0; z-index:3; animation:mg1BootLogo 1.05s cubic-bezier(.22,1,.36,1) 3.0s forwards; }
  .mg1-boot-logo { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 20px rgba(249,115,22,.75)) drop-shadow(0 0 34px rgba(56,189,248,.38)); user-select:none; -webkit-user-drag:none; }
  .mg1-boot-wordmark { position:absolute; left:50%; top:50%; width:min(92vw,390px); transform:translate(-50%,-50%); display:flex; justify-content:center; align-items:center; gap:clamp(1px,.7vw,5px); z-index:4; }
  .mg1-boot-letter { display:block; font-family:Inter,system-ui,-apple-system,sans-serif; font-size:clamp(38px,12vw,68px); line-height:.9; font-weight:900; letter-spacing:-.055em; opacity:0; transform:translateX(calc((var(--i) - 4) * 62px)) rotate(calc((var(--i) - 4) * 9deg)) scale(.72); animation:mg1BootLetter 1.05s cubic-bezier(.22,1,.36,1) calc(3.72s + var(--i) * .07s) forwards; text-shadow:0 0 24px rgba(255,255,255,.12); }
  .mg1-boot-bottom { position:absolute; left:50%; top:62%; transform:translateX(-50%); width:min(72vw,220px); display:flex; flex-direction:column; align-items:center; z-index:5; }
  .mg1-boot-tagline { font-size:9px; font-weight:700; letter-spacing:.34em; color:#888; white-space:nowrap; opacity:0; animation:mg1BootTagline .8s ease-out 5.45s forwards; }
  .mg1-boot-progress { margin-top:18px; width:100%; height:2px; background:rgba(255,255,255,.1); border-radius:999px; overflow:hidden; }
  .mg1-boot-progress span { display:block; width:0; height:100%; background:#fff; box-shadow:0 0 10px rgba(255,255,255,.9); animation:mg1BootProgress 6.2s linear forwards; }
  .mg1-boot-brand { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); font-size:8px; letter-spacing:.42em; color:rgba(255,255,255,.22); white-space:nowrap; }
  @keyframes mg1BootOrbit { to { transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes mg1BootLogo { 0% { opacity:0; transform:translate(-50%,-50%) scale(.25); } 55% { opacity:1; transform:translate(-50%,-50%) scale(1.12); } 100% { opacity:1; transform:translate(-50%,-50%) scale(1); } }
  @keyframes mg1BootLetter { 0% { opacity:0; transform:translateX(calc((var(--i) - 4) * 62px)) rotate(calc((var(--i) - 4) * 9deg)) scale(.72); } 100% { opacity:1; transform:translateX(0) rotate(0) scale(1); } }
  @keyframes mg1BootTagline { to { opacity:1; transform:translateY(0); } }
  @keyframes mg1BootProgress { to { width:100%; } }
  @media (max-width:380px) {
    .mg1-boot-wordmark { width:94vw; }

  @media (prefers-reduced-motion: reduce) {
    .mg1-boot-orbit { animation:none; }
    .mg1-boot-logo-wrap { animation:none; opacity:1; transform:translate(-50%,-50%) scale(1); }
    .mg1-boot-letter { animation:none; opacity:1; transform:none; }
    .mg1-boot-tagline { animation:none; opacity:1; }
    .mg1-boot-progress span { animation:none; width:100%; }
  }
  /* V14.15 -- Boot selesai -> Dashboard entrance SEKALI. Tidak dipakai saat pindah tab. */
  .mg1-dashboard-boot-enter .app-main > * { animation: mg1DashboardEnter 520ms cubic-bezier(.22,1,.36,1) both; }
  .mg1-dashboard-boot-enter .app-main > *:nth-child(1) { animation-delay:0ms; }
  .mg1-dashboard-boot-enter .app-main > *:nth-child(2) { animation-delay:70ms; }
  .mg1-dashboard-boot-enter .app-main > *:nth-child(3) { animation-delay:140ms; }
  .mg1-dashboard-boot-enter .app-main > *:nth-child(4) { animation-delay:210ms; }
  .mg1-dashboard-boot-enter .app-main > *:nth-child(5) { animation-delay:280ms; }
  @keyframes mg1DashboardEnter { from { opacity:0; transform:translateY(14px) scale(.985); } to { opacity:1; transform:none; } }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.35s ease both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
</style>

<script>

// ==== KONFIGURASI -- WAJIB SAMA PERSIS DENGAN index.html/member.html web ====

let currentTab = 'ringkasan';
// [PARTISI -- 4 Sep, Tahap 4] globalCOGConfig/globalDiggingToday/globalValidasiToday/
// globalValidasiFullForMap dipindah ke scripts/digging.js (co-located dgn loadRingkasanData()
// yg mengisinya) -- dibaca dari validasi.js/peta.js via global scope, sama seperti sebelumnya.

// [PARTISI -- 4 Sep, Tahap 4] State Peta (zoom/detail/North Arrow/Mode Ukur) dipindah ke scripts/peta.js.

// ==== ICONS ====


// ==== RENDER: SPLASH ====

// React runtime dari artefak sumber TIDAK dibawa ke Member Android; hanya visual/motion-nya

function renderSplash() {
  return '' +
  '<div id="mg1-boot" class="mg1-boot" aria-label="Memuat MINE GEOLOGIST">' +
    '<div class="mg1-boot-glow mg1-boot-glow-blue"></div>' +
    '<div class="mg1-boot-glow mg1-boot-glow-orange"></div>' +
    '<div class="mg1-boot-orbit" aria-hidden="true">' +
      '<span class="mg1-orbit-dot mg1-orbit-blue"></span>' +
      '<span class="mg1-orbit-dot mg1-orbit-orange"></span>' +

    '<div class="mg1-boot-logo-wrap">' +

      '<span class="mg1-boot-letter" style="--i:0">L</span>' +
      '<span class="mg1-boot-letter" style="--i:1">I</span>' +
      '<span class="mg1-boot-letter" style="--i:2">T</span>' +
      '<span class="mg1-boot-letter" style="--i:3">H</span>' +
      '<span class="mg1-boot-letter" style="--i:4">O</span>' +
      '<span class="mg1-boot-letter" style="--i:5">S</span>' +

      '<span class="mg1-boot-letter" style="--i:8">E</span>' +

function startMg1BootAnimation_() {
  const durationMs = 7200;
  window.__mg1BootAnimationDone__ = false;
  window.__mg1BootAnimationPromise__ = new Promise(resolve => {
    window.__mg1BootAnimationResolve__ = resolve;
    setTimeout(() => {
      window.__mg1BootAnimationDone__ = true;
      if (window.__mg1BootAnimationResolve__) {
        window.__mg1BootAnimationResolve__();
        window.__mg1BootAnimationResolve__ = null;
      }
    }, durationMs);
  });
  return window.__mg1BootAnimationPromise__;
}

// [PARTISI -- 4 Sep, Tahap 3] loginModalOpen, loginStatusMsg/Ok/Busy, renderLoginModal,
// openLoginModal, closeLoginModal -- semua dipindah ke scripts/auth.js.

// ==== RENDER: HEADER (dipakai di semua tab) ====
function renderHeader() {
  const hasSession = !!(sessionInfo && sessionInfo.userName);
  const initials = hasSession ? sessionInfo.userName.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() : '';
  const customAvatar = hasSession ? getCustomAvatarDataUrl() : '';
  const todayLabel = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  return '' +
  '<header class="shrink-0 sticky top-0 z-40 px-4 h-[64px] flex items-center justify-between bg-[#070b1c] border-b border-white/[0.08]">' +
    '<div class="flex items-center gap-3">' +
      '<img src="../assets/lithosite-logo.png" alt="Lithosite" class="w-10 h-10 object-contain">' +
      '<div>' +
        '<div class="text-white font-bold tracking-tight text-[15px] leading-none">MINE GEOLOGIST</div>' +
        '<div class="flex items-center gap-1.5 mt-[4px]">' +
          '<span class="w-[7px] h-[7px] rounded-full bg-[#22c55e] animate-pulse inline-block"></span>' +
          '<span class="text-[10px] font-bold tracking-wide text-white/55">Lithosite &bull; ' + todayLabel + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="flex items-center gap-2">' +
      // Ikon chat: placeholder visual dulu (belum disambungkan ke Chat Tim beneran) --
      // ditandai jelas, bukan lupa dikerjakan.
      '<button onclick="openChatModal()" class="w-9 h-9 rounded-full bg-[#0b1329] border border-white/[0.08] flex items-center justify-center relative">' +
        icon('message-circle-more','w-[18px] h-[18px] text-white/70') +
      '</button>' +
      // Avatar: tempat Login/Logout beneran (fungsi lama dipertahankan, restyle saja).
      // BARU (27 Agu): kalau Member sudah pasang Foto Profil lokal, tampilkan itu --
      // fallback ke inisial nama seperti sebelumnya kalau belum/sudah dicopot.
      '<button onclick="toggleAccountMenu()" class="w-8 h-8 rounded-full bg-[#0b1329] border border-white/[0.08] overflow-hidden flex items-center justify-center text-[10px] font-bold text-blue-200">' +
        (customAvatar ? '<img src="' + customAvatar + '" class="w-full h-full object-cover">' : (hasSession ? initials : icon('user','w-3.5 h-3.5 text-white/60'))) +
      '</button>' +
    '</div>' +
  '</header>';
}
function renderSectionTitle(title, right) {
  return '<div class="shrink-0 flex items-center justify-between h-[18px] mb-[10px]">' +
    '<h2 class="text-white font-black text-[11px] tracking-[0.12em] leading-none">' + title + '</h2>' +
    (right ? '<span class="text-[10px] text-white/40 font-medium leading-none">' + right + '</span>' : '') +
  '</div>';

// [PARTISI -- 4 Sep, Tahap 4] Modal Chat Tim dipindah ke scripts/chat.js.

// ==== RENDER: BOTTOM NAV ====
const TABS = [
  { id:'ringkasan', label:'Ringkasan', icon:'layout-grid' },
  { id:'tabel', label:'Digging', icon:'table-2' },
  { id:'validasi', label:'Validasi', icon:'shield-check' },
  { id:'peta', label:'Peta', icon:'map' }
];
function renderBottomNav() {
  let html = '<nav class="shrink-0 w-full flex items-center justify-around" style="background:#0b1329;border-top:1px solid rgba(255,255,255,0.08);height:72px;padding:8px;">';
  TABS.forEach(t => {
    const active = currentTab === t.id;
    html += '<button onclick="switchTab(\'' + t.id + '\')" class="flex flex-col items-center justify-center gap-[5px] px-3 py-1 rounded-[8px]">' +
      '<div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 border ' + (active ? 'border-2 border-[#2563eb] bg-[#2563eb]/10' : 'border-transparent') + '">' +
      icon(t.icon, 'w-[18px] h-[18px] ' + (active ? 'text-[#2563eb]' : 'text-white/40')) +
      '</div>' +
      '<span class="text-[10px] font-bold tracking-wide leading-none ' + (active ? 'text-[#2563eb]' : 'text-white/40') + '">' + t.label + '</span>' +
    '</button>';
  });
  html += '</nav>';
  return html;
}

// ==== RENDER: RINGKASAN ====
// ==== HELPER: cari field di objek row tanpa peduli ejaan header persis

function renderSimpleModal(title, subtitle, bodyHtml, closeFn, extraHeaderBtn, justOpened) {
  // justOpened default true (kalau parameter tidak diisi) supaya perilaku lama TIDAK
  // berubah di titik manapun yang lupa di-update -- animasi tetap main spt sebelumnya,
  // aman/fail-safe, cuma kehilangan optimisasi anti-kedip di titik yg terlewat itu saja.
  const animClass = (justOpened === false) ? '' : ' fade-in';
  return '' +
  '<div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 flex items-end' + animClass + '" onclick="if(event.target===this)' + closeFn + '">' +
    // [DIPERBAIKI] max-h-[85vh] SEBELUMNYA pakai unit vh murni -- di Android ini sering
    // dihitung dari tinggi LAYAR PENUH, TIDAK ikut menyusut saat keyboard terbuka. Akibatnya
    // modal "percaya" dia masih punya ruang 85% layar penuh, padahal ~40% bagian bawahnya
    // sudah tertutup keyboard -- field/tombol di bagian bawah modal (spt Simpan Peta) jadi
    // tersembunyi total, tidak terjangkau walau modal secara teknis overflow-y:auto (area
    // yg BENAR-BENAR archInterior tetap dihitung dari asumsi vh yg salah). Sekarang pakai
    // --mg1-vvh yg SAMA dgn fix keyboard (index.html) -- otomatis menyusut hanya saat ada
    // input difokus, konsisten dgn 1 sumber kebenaran yg sama.
    '<div class="w-full max-w-[480px] mx-auto bg-[#0e1933] rounded-t-[24px] overflow-y-auto border-t border-white/10" style="max-height:calc(var(--mg1-vvh, 100svh) * 0.85);">' +
      '<div class="sticky top-0 bg-[#0e1933] px-5 pt-5 pb-3 border-b border-white/[0.06] flex items-center justify-between">' +
        '<div><div class="text-sm font-bold text-white">' + title + '</div><div class="text-[10px] text-white/35">' + subtitle + '</div></div>' +
        '<div class="flex items-center gap-2">' +
          (extraHeaderBtn || '') +
          '<button onclick="' + closeFn + '" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">' + icon('x','w-4 h-4 text-white/50') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="px-5 py-4">' + bodyHtml + '</div>' +
    '</div>' +
  '</div>';
}

// termasuk saat cuma status loading DALAM modal yang berubah (mis. KPI selesai fetch data)

// selagi tetap terbuka -- animasi 'fade-in' cuma dipasang utk kasus pertama.
let _prevModalSnapshot = {};
function _computeJustOpenedModals() {
  const snap = {
    updateAssay: !!updateAssayModalOpen,
    login: !!loginModalOpen,
    chat: !!chatModalOpen,
    diggingDetail: !!diggingDetailOpen,
    validasiDetail: !!validasiDetailOpen,
    validasiForm: !!validasiFormOpen,
    report: !!reportModalOpen,
    kpi: !!kpiModalOpen,
    jsa: !!jsaModalOpen,
    settings: !!settingsModalOpen,
    issue: !!issueModalOpen,
    digging: !!diggingModalOpen,
    mapDetail: !!mapDetailIdTp
  };
  const justOpened = {};
  for (const key in snap) justOpened[key] = snap[key] && !_prevModalSnapshot[key];
  _prevModalSnapshot = snap;
  return justOpened;
}

// [BARU] Animasi count-up angka statistik dashboard (Ringkasan) -- dari 0 naik ke nilai
// asli dgn easing halus, TIDAK mengubah nilai akhir (angka final tetap presisi sama).
// Generik: bekerja pada elemen mana pun ber-atribut data-countup-target, tidak spesifik
// ke Ringkasan saja (kalau nanti dipakai di tab lain, tinggal beri atribut yg sama).
function runDashboardCountUp_() {
  const els = document.querySelectorAll('[data-countup-target]');
  if (!els.length) return;
  const DURATION_MS = 900;
  const startedAt = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  // Ease-out kubik: cepat di awal, melambat halus mendekati nilai akhir -- kesan "hitung
  // cepat lalu mendarat", bukan linear monoton yg terasa kaku.
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const targets = Array.prototype.map.call(els, (el) => ({
    el,
    target: Number(el.getAttribute('data-countup-target')) || 0,
    decimals: Number(el.getAttribute('data-countup-decimals')) || 0,
    suffix: el.getAttribute('data-countup-suffix') || ''
  }));
  function tick(now) {
    const elapsed = (typeof performance !== 'undefined' && performance.now) ? performance.now() - startedAt : Date.now() - startedAt;
    const t = Math.max(0, Math.min(1, elapsed / DURATION_MS));
    const eased = easeOutCubic(t);
    targets.forEach((item) => {
      const current = item.target * eased;
      item.el.textContent = current.toFixed(item.decimals) + item.suffix;
    });
    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      // Kunci ke nilai akhir PERSIS (hindari sisa galat pembulatan easing di frame terakhir).
      targets.forEach((item) => { item.el.textContent = item.target.toFixed(item.decimals) + item.suffix; });
    }
  }
  requestAnimationFrame(tick);
}

function render() {
  if (window.__mg1BootAnimationDone__ === false) return;
  const app = document.getElementById('app');
  const justOpened = _computeJustOpenedModals();
  // Gerbang Login WAJIB tidak dipasang di sini (app tetap langsung buka ke shell utama) --
  // Login sekarang jadi OPSIONAL lewat avatar di header (renderLoginModal), sesuai arahan.
  let html;
  if (currentTab === 'tabel') html = renderTabel();
  else if (currentTab === 'validasi') html = renderValidasi();
  else if (currentTab === 'peta') html = renderPeta(justOpened);
  else html = renderRingkasan();
  html += renderDiggingModal(justOpened.digging);
  html += renderLoginModal(justOpened.login);
  html += renderAccountMenu();
  html += renderKpiModal(justOpened.kpi);
  html += renderJsaModal(justOpened.jsa);
  html += renderIssueModal(justOpened.issue);
  html += renderChatModal(justOpened.chat);
  html += renderValidasiDetailModal(justOpened.validasiDetail);
  html += renderDiggingDetailModal(justOpened.diggingDetail);
  html += renderUpdateAssayModal(justOpened.updateAssay);
  html += renderValidasiFormModal(justOpened.validasiForm);
  html += renderReportModal(justOpened.report);
  html += renderSettingsModal(justOpened.settings);
  app.innerHTML = html;
  if (window.lucide) lucide.createIcons();

  // V14.15: setelah boot selesai, tampilkan entrance Dashboard SEKALI.
  // Tidak diputar ulang ketika user pindah tab atau render data berikutnya.
  if (!window.__mg1DashboardEntranceDone__ && currentTab === 'tabel') {
    const shell = app.querySelector('.app-shell');
    if (shell) {
      window.__mg1DashboardEntranceDone__ = true;
      shell.classList.add('mg1-dashboard-boot-enter');
      setTimeout(() => shell.classList.remove('mg1-dashboard-boot-enter'), 900);
    }
  }

  // [BARU] Animasi count-up 4 kartu statistik Ringkasan -- SEKALI saja stlh boot selesai
  // (bukan tiap kali pindah balik ke tab Ringkasan, supaya tidak mengganggu/berulang).
  // [DIPERBAIKI] SEBELUMNYA animasi dianggap "selesai" begitu render PERTAMA terjadi --
  // padahal render pertama saat boot sering terjadi SEBELUM data selesai di-fetch (masih
  // 0/kosong). Akibatnya animasi "keburu" jalan target 0, lalu flag terkunci selamanya --
  // saat data ASLI datang & render ulang, angka asli tidak pernah dianimasikan/ditampilkan.
  // Sekarang: tunggu sampai globalDiggingToday BENAR-BENAR punya isi (data asli termuat)
  // baru animasi dijalankan & flag dikunci.
  if (!window.__mg1DashboardCountUpDone__ && document.getElementById('mg1-countup-1') &&
      typeof globalDiggingToday !== 'undefined' && globalDiggingToday.length > 0) {
    window.__mg1DashboardCountUpDone__ = true;
    runDashboardCountUp_();
  }

  const loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', function(ev) {
      ev.preventDefault();
      const loginId = document.getElementById('login-id-input').value.trim();
      const email = document.getElementById('login-email-input').value.trim();
      const pin = document.getElementById('login-pin-input').value.trim();
      loginBusy = true; render();
      submitLogin(loginId, email, pin, (msg, ok, busy) => {
        loginStatusMsg = msg; loginStatusOk = ok; loginBusy = !!busy;
        if (!busy) render();
      }).finally(() => { loginBusy = false; });
    });
  }
}

// ==== BOOT ====
// BARU (27 Agu): daftarkan Service Worker -- Member App sekarang PWA sungguhan,
// bisa di-install ke homescreen Android, ikon+nama ikut manifest.json (share
// assets/ dgn dashboard utama). Gagal daftar (mis. browser lama) tidak boleh
// menghentikan app -- app tetap jalan normal tanpa PWA kalau SW gagal.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=20260906k3', { updateViaCache: 'none' }).then((reg) => {
      // Force an update check so a stale HTTP-cached sw.js cannot pin an old app shell.
      reg.update().catch(() => {});
    }).catch((err) => {
      console.warn('Gagal mendaftarkan Service Worker Member App:', err);
    });

    // When the new SW takes control, reload once so peta.js/index.html are served
    // consistently from the new cache generation.
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}

// [BARU -- fix keyboard "abnormal" di form panjang spt Digging/Validasi] html/body
// dikunci position:fixed + 100svh (lihat komentar di CSS .app-shell) supaya gestur
// pull-to-refresh tidak "menarik" dokumen -- tapi ini juga berarti TIDAK ADA mekanisme
// bawaan yg menyesuaikan tinggi saat keyboard Android muncul. Browser biasanya auto-scroll
// input yg di-fokus ke area terlihat, tapi dalam layout fixed+svh terkunci ini perilaku
// itu jadi tidak konsisten -- keyboard bisa menutupi input yg sedang diketik, terutama
// di form dgn banyak field spt Digging/Validasi (Login/Peta kebetulan field-nya sedikit,
// jadi jarang mentok ke skenario ini).
// Fix: dengar window.visualViewport (area yg BENAR2 terlihat, di luar area keyboard),
// set custom property --mg1-vvh supaya .app-shell menyusut mengikuti ruang yg tersisa
// (bukan overlap dgn keyboard) -- lalu scrollIntoView input yg fokus supaya selalu
// masuk area yg sudah menyusut itu.
// [DIPERBAIKI ke-2 -- Peta tab masih kena imbas] Versi ambang-batas (>120px) masih
// mengaktifkan --mg1-vvh berdasar UKURAN viewport semata -- tapi peta.js (STEP04) PUNYA
// listener resize SENDIRI utk auto-fit peta (getMapViewportRatio_/scheduleMapViewportFit_).
// Begitu --mg1-vvh berubah (shell menyusut/melebar), kontainer peta (flex-1 min-h-0) ikut
// berubah ukuran, MEMICU ULANG sistem fit peta itu -- kejadian di tab Peta walau user
// tidak sedang mengetik apa pun (mis. cuma pan/zoom, atau sekadar viewport Android goyah
// sesaat). Sekarang jauh lebih presisi: --mg1-vvh HANYA aktif selama ADA input/textarea/
// select yg BENAR-BENAR difokus (state eksplisit, bukan tebak dari ukuran) -- di luar itu
// (termasuk sepanjang waktu di tab Peta yg murni visual, 0 keyboard terlibat), shell selalu
// 100svh tetap seperti semula, sistem fit peta tidak pernah terusik oleh ini.
(function setupKeyboardViewportFix_() {
  if (typeof window === 'undefined' || !window.visualViewport) return;
  const vv = window.visualViewport;
  let inputFocused = false;
  let rafPending = false;
  const applyVvh_ = () => {
    rafPending = false;
    if (inputFocused) {
      document.documentElement.style.setProperty('--mg1-vvh', vv.height + 'px');
    } else {
      document.documentElement.style.setProperty('--mg1-vvh', '100svh');
    }
  };
  const scheduleApply_ = () => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(applyVvh_);
  };
  vv.addEventListener('resize', scheduleApply_);

  const isTextField_ = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');

  document.addEventListener('focusin', (event) => {
    const el = event.target;
    if (!isTextField_(el)) return;
    inputFocused = true;
    scheduleApply_();
    setTimeout(() => {
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
    }, 250);
  });
  document.addEventListener('focusout', (event) => {
    if (!isTextField_(event.target)) return;
    // Jeda kecil: kalau fokus langsung pindah ke input LAIN (Tab/next field), jangan
    // sempat "kedip" balik ke 100svh dulu di antaranya.
    setTimeout(() => {
      const stillTextField = isTextField_(document.activeElement);
      if (!stillTextField) { inputFocused = false; scheduleApply_(); }
    }, 50);
  });
})();

  document.getElementById('app').innerHTML = renderSplash();

  const bootAnimationReady = startMg1BootAnimation_();
  setTimeout(async () => {

    // [BARU -- 4 Sep] fetchCrsConfig() dipanggil PARALEL (bukan di-await), TIDAK menunda
    // transisi splash->konten -- North Arrow baru benar2 dipakai saat user buka tab Peta,
    // jauh sesudah boot ini selesai, jadi tidak perlu jadi bagian critical-path splash.
    fetchCrsConfig();
    // [BARU -- 5 Sep] Muat daftar peta background dari IndexedDB (lokal HP) -- diikuti
    // render() manual krn fungsi ini TIDAK otomatis panggil render() sendiri (beda dari
    // loadRingkasanData yg sudah dijelaskan di bawah). IndexedDB lokal, biasanya cepat
    // (milidetik), tapi tetap tidak di-await supaya tidak menunda splash->konten.
    loadBackgroundMapsFromDb_().then(() => render());
    // FIX (27 Agu): splash TIDAK boleh langsung diganti Ringkasan sebelum data beneran
    // siap -- sebelumnya render() dipanggil DULUAN di sini, jadi user sempat lihat
    // Ringkasan kosong (0 Ton dkk) sesaat sebelum data asli masuk, dikira error/rusak.
    // loadRingkasanData() sendiri SUDAH memanggil render() di baris terakhirnya begitu
    // data selesai (sukses ATAU gagal) -- splash otomatis tetap tampil sampai saat itu,
    // tidak perlu render() terpisah di sini lagi.
    await loadRingkasanData();
    await bootAnimationReady;
    window.__mg1BootAnimationDone__ = true;
    render();
  }, 900);
});
