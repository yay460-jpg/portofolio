 * GEOBANK MINERALS -- MEMBER (ANDROID COMPANION APP)

 * SATU MASTER: backend Apps Script yang SAMA PERSIS dengan dashboard web --

// ==== KONFIGURASI -- WAJIB SAMA PERSIS DENGAN index.html/member.html web ====
const GOOGLE_SCRIPT_READ_URL = 'https://script.google.com/macros/s/AKfycbwVeP2inU_-Cm4aazxiaTfulb_ta3OalMdKk9icwqRUNVF-Rz8n9cnhylQuWOspYh2Ztw/exec';
const APP_VERSION = 'v90.2.100';

// ==== STATE GLOBAL ====
let currentTab = 'ringkasan';
let globalCOGConfig = null;
let globalDiggingToday = [];
let globalValidasiToday = [];
let sessionInfo = null; // {token, userName, loginId, roleId, avatarUrl}
let loginInFlight = false;
let diggingFormState = { tanggal:'', shift:'Pagi', cuaca:'Cerah', pit:'', blok:'', tipe_ore:'Sapro', id_sampel:'', total_sampel:'', ni:'', fe:'', co:'', mgo:'', sio2:'', tujuan:'', ship:'' };

// ==== UTIL: sesi tersimpan (nama key SAMA dengan dashboard web, biar konsisten) ====
function saveSession(result, loginIdFallback) {
  sessionInfo = {
    token: result.token,
    sessionId: result.session_id || '',
    userId: result.user_id || '',
    loginId: result.login_id || loginIdFallback,
    roleId: result.role_id || 'MEMBER',
    userName: result.user_name || result.login_id || loginIdFallback,
    avatarUrl: result.avatar_url || result.photo_url || result.avatar || ''
  };
  try {
    localStorage.setItem('mine_member_token', sessionInfo.token);
    localStorage.setItem('mine_member_session_id', sessionInfo.sessionId);
    localStorage.setItem('mine_member_user_id', sessionInfo.userId);
    localStorage.setItem('mine_member_login_id', sessionInfo.loginId);
    localStorage.setItem('mine_member_role_id', sessionInfo.roleId);
    localStorage.setItem('mine_member_user_name', sessionInfo.userName);
    localStorage.setItem('mine_member_avatar_url', sessionInfo.avatarUrl);
  } catch (e) {}
}
function loadStoredSession() {
  try {
    const token = localStorage.getItem('mine_member_token');
    if (!token) return null;
    return {
      token: token,
      sessionId: localStorage.getItem('mine_member_session_id') || '',
      userId: localStorage.getItem('mine_member_user_id') || '',
      loginId: localStorage.getItem('mine_member_login_id') || '',
      roleId: localStorage.getItem('mine_member_role_id') || 'MEMBER',
      userName: localStorage.getItem('mine_member_user_name') || '',
      avatarUrl: localStorage.getItem('mine_member_avatar_url') || ''
    };
  } catch (e) { return null; }
}
function clearSession() {
  sessionInfo = null;
  try {
    ['mine_member_token','mine_member_session_id','mine_member_user_id','mine_member_login_id','mine_member_role_id','mine_member_user_name','mine_member_avatar_url']
      .forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}

// ==== FETCH HELPERS -- 1 MASTER: URL & pola auth sama persis dgn dashboard web ====
function withReadAuthToken(url) {
  if (!sessionInfo) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'sessionToken=' + encodeURIComponent(sessionInfo.token);
}
async function fetchWithTimeout(url, options, timeoutMs) {
  options = options || {};
  timeoutMs = timeoutMs || 20000;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const method = String(options.method || 'GET').toUpperCase();
    const requestUrl = method === 'GET' ? withReadAuthToken(url) : url;
    return await fetch(requestUrl, Object.assign({}, options, { signal: controller.signal }));
  } finally {
    clearTimeout(timer);
  }
}
function buildAuthenticatedPayload(fields) {
  const payload = new URLSearchParams(fields);
  if (sessionInfo) payload.set('sessionToken', sessionInfo.token);
  return payload;
}

// ==== LOGIN (verifyMemberPin) -- endpoint & field SAMA PERSIS dgn dashboard web ====
async function submitLogin(loginId, email, pin, onStatus) {
  if (loginInFlight) return;
  if (!loginId || !email || !/^[0-9]{6}$/.test(pin)) {
    onStatus('Login_ID, email terdaftar, dan PIN 6 digit wajib diisi.', false);
    return;
  }
  loginInFlight = true;
  onStatus('Memeriksa akun member...', true, true);
  try {
    const payload = new URLSearchParams({
      action: 'verifyMemberPin',
      login_id: loginId,
      email: email,
      pin: pin,
      client_info: (navigator.userAgent || '').slice(0, 180)
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (!result.success || !result.token) {
      if (result.locked && result.retry_after) {
        onStatus('Credential terkunci. Coba lagi dalam ' + result.retry_after + ' detik.', false);
      } else if (result.rate_limited || result.brute_force_blocked) {
        onStatus('Terlalu banyak percobaan. Coba lagi sebentar lagi.', false);
      } else {
        onStatus(result.message || 'Login member gagal.', false);
      }
      return;
    }
    saveSession(result, loginId);
    onStatus('Login berhasil sebagai ' + sessionInfo.userName + '.', true);
    setTimeout(() => { loginModalOpen = false; render(); loadRingkasanData(); }, 500);
  } catch (err) {
    console.error('Login error:', err);
    onStatus('Tidak bisa menghubungi server. Coba lagi.', false);
  } finally {
    loginInFlight = false;
  }
}

// ==== COGConfig (fetch live -- BUKAN hardcode, sama sumber dgn dashboard web) ====
async function fetchCOGConfig() {
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=cogconfig&t=' + Date.now());
    const result = await response.json();
    if (result.status !== 'success') throw new Error(result.message || 'Gagal memuat COGConfig');
    const rows = result.data || [];
    const cfg = { Sapro: null, Limo: null, Limo_Aktif: false, SM_Threshold_AutoDetect: 3, Bucket_per_Sampel: 8 };
    rows.forEach(row => {
      const tipe = (row['Tipe_Ore'] || '').toString().trim();
      const batas = {
        Batas_Waste_LG: parseFloat(row['Batas_Waste_LG']),
        Batas_LG_MG: parseFloat(row['Batas_LG_MG']),
        Batas_MG_HG: parseFloat(row['Batas_MG_HG']),
        Batas_HG_VHG: parseFloat(row['Batas_HG_VHG']),
        WMT_per_Bucket: (row['WMT_per_Bucket'] !== undefined && row['WMT_per_Bucket'] !== '' && !isNaN(parseFloat(row['WMT_per_Bucket']))) ? parseFloat(row['WMT_per_Bucket']) : 2.2
      };
      if (tipe === 'Sapro') cfg.Sapro = batas;
      if (tipe === 'Limo') cfg.Limo = batas;
      if (row['Limo_Aktif'] !== undefined && row['Limo_Aktif'] !== '') cfg.Limo_Aktif = String(row['Limo_Aktif']).trim().toUpperCase() === 'TRUE';
      if (row['SM_Threshold_AutoDetect'] !== undefined && row['SM_Threshold_AutoDetect'] !== '') { const v = parseFloat(row['SM_Threshold_AutoDetect']); if (!isNaN(v)) cfg.SM_Threshold_AutoDetect = v; }
      if (row['Bucket_per_Sampel'] !== undefined && row['Bucket_per_Sampel'] !== '') { const v = parseFloat(row['Bucket_per_Sampel']); if (!isNaN(v)) cfg.Bucket_per_Sampel = v; }
    });
    if (!cfg.Sapro) cfg.Sapro = { Batas_Waste_LG:0.8, Batas_LG_MG:1.25, Batas_MG_HG:1.45, Batas_HG_VHG:1.7, WMT_per_Bucket:2.2 };
    if (!cfg.Limo) cfg.Limo = { Batas_Waste_LG:0.8, Batas_LG_MG:1.25, Batas_MG_HG:1.45, Batas_HG_VHG:1.7, WMT_per_Bucket:2.2 };
    globalCOGConfig = cfg;
  } catch (err) {
    console.error('Gagal memuat COGConfig, pakai fallback:', err);
    globalCOGConfig = { Sapro:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7,WMT_per_Bucket:2.2}, Limo:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7,WMT_per_Bucket:2.2}, Limo_Aktif:false, SM_Threshold_AutoDetect:3, Bucket_per_Sampel:8 };
  }
}

// ==== classifyMaterial() -- LOGIC IDENTIK dgn dashboard.html, jangan pernah menyimpang ====
function classifyMaterial(ni, tipeOreInput, smValue) {
  const niNum = parseFloat(ni) || 0;
  const cfg = globalCOGConfig || { Sapro:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7}, Limo:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7}, Limo_Aktif:false, SM_Threshold_AutoDetect:3 };
  let tipeOreFinal = (tipeOreInput || 'Sapro').trim();
  if (!cfg.Limo_Aktif) {
    tipeOreFinal = 'Sapro';
  } else if (tipeOreFinal === 'Auto') {
    const sm = parseFloat(smValue) || 0;
    tipeOreFinal = (sm >= cfg.SM_Threshold_AutoDetect) ? 'Limo' : 'Sapro';
  } else if (tipeOreFinal !== 'Sapro' && tipeOreFinal !== 'Limo') {
    tipeOreFinal = 'Sapro';
  }
  const batas = cfg[tipeOreFinal] || cfg.Sapro;
  let classGrade;
  if (niNum <= 0) classGrade = 'N/A';
  else if (niNum < batas.Batas_Waste_LG) classGrade = 'Waste';
  else if (niNum < batas.Batas_LG_MG) classGrade = 'LG';
  else if (niNum < batas.Batas_MG_HG) classGrade = 'MG';
  else if (niNum < batas.Batas_HG_VHG) classGrade = 'HG';
  else classGrade = 'VHG';
  return { classGrade, tipeOreFinal };
}
// Tonase = Total Sampel x Bucket_per_Sampel x WMT_per_Bucket -- IDENTIK dgn updateDiggingTonaseAuto() web
function computeTonase(totalSampel, tipeOreSelected, smVal) {
  const cfg = globalCOGConfig || { Sapro:{WMT_per_Bucket:2.2}, Limo:{WMT_per_Bucket:2.2}, Limo_Aktif:false, SM_Threshold_AutoDetect:3, Bucket_per_Sampel:8 };
  const ts = parseFloat(totalSampel);
  if (isNaN(ts) || ts <= 0) return '';
  let tipeOreFinal = tipeOreSelected;
  if (!cfg.Limo_Aktif) tipeOreFinal = 'Sapro';
  else if (tipeOreSelected === 'Auto') tipeOreFinal = (!isNaN(smVal) && smVal >= (cfg.SM_Threshold_AutoDetect || 3)) ? 'Limo' : 'Sapro';
  else if (tipeOreSelected !== 'Sapro' && tipeOreSelected !== 'Limo') tipeOreFinal = 'Sapro';
  const wmt = (cfg[tipeOreFinal] && cfg[tipeOreFinal].WMT_per_Bucket) || 2.2;
  const bucketPerSampel = cfg.Bucket_per_Sampel || 8;
  return (ts * bucketPerSampel * wmt).toFixed(2);
}
function computeSM(mgo, sio2) {
  const m = parseFloat(mgo), s = parseFloat(sio2);
  if (!isNaN(m) && m > 0 && !isNaN(s)) return (s / m).toFixed(2);
  return '';
}

// ==== DATA: Digging (Produksi_GC) hari ini ====
function todayDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
let dataLoadErrorMsg = ''; // ditampilkan di UI kalau fetch gagal/ditolak server -- jangan disembunyikan lagi
let diggingViewMode = 'today'; // 'today' kalau ada data hari ini, 'recent' kalau fallback ke entri terbaru
async function loadRingkasanData() {
  dataLoadErrorMsg = '';
  await fetchCOGConfig();
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=produksi&t=' + Date.now());
    const result = await response.json();
    if (result.status === 'error') {
      // Server merespons 200 tapi menolak permintaan (mis. Unauthorized krn belum ada
      // sessionToken selama Login ditunda) -- ini BUKAN "data kosong", tampilkan apa adanya.
      dataLoadErrorMsg = result.message || 'Server menolak permintaan data.';
      globalDiggingToday = [];
    } else {
      const rows = result.data || [];
      const todayLabel = new Date().toDateString();
      const todaysRows = rows.filter(r => {
        const t = r['Tanggal'];
        if (!t) return false;
        const dt = new Date(t);
        return !isNaN(dt) && dt.toDateString() === todayLabel;
      });
      if (todaysRows.length) {
        globalDiggingToday = todaysRows;
        diggingViewMode = 'today';
      } else {
        // FALLBACK: belum ada entri persis hari ini -- daripada tampil kosong total (bikin
        // seolah data tidak tersinkron), tampilkan entri TERBARU yang sudah tercatat di
        // sheet, diurutkan tanggal terbaru dulu. UI menandai ini beda dari "hari ini".
        const sorted = rows.slice().sort((a, b) => new Date(b['Tanggal']) - new Date(a['Tanggal']));
        globalDiggingToday = sorted.slice(0, 15);
        diggingViewMode = 'recent';
      }
    }
  } catch (err) {
    console.error('Gagal memuat data Digging:', err);
    dataLoadErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
    globalDiggingToday = [];
  }
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=validasi&t=' + Date.now());
    const result = await response.json();
    if (result.status === 'error') {
      globalValidasiToday = [];
    } else {
      // FIX (27 Agu): baris kedalaman lanjutan (2m/3m/4m/5m) SENGAJA punya ID_TP kosong
      // di sheet asli -- cuma kedalaman pertama yang diisi ID_TP/Area/Bench/dst, baris
      // berikutnya cuma punya Meter+assay. Filter lama ("wajib ID_TP terisi") salah buang
      // baris-baris ini. Sekarang pakai forward-fill: baris kosong ID_TP tapi PUNYA nilai
      // Meter mewarisi ID_TP dari baris TP terakhir di atasnya (urutan sheet asli, SEBELUM
      // dibalik/reverse). Baris yang benar-benar kosong (tanpa ID_TP maupun Meter) tetap
      // dibuang -- itu baris sampah formula/formatting leftover yang sudah difilter sejak awal.
      const rawRows = result.data || [];
      let lastTp = '';
      const filled = [];
      rawRows.forEach(r => {
        const idTp = String(getField(r,'ID_TP')||'').trim();
        const meterVal = String(getField(r,'Meter')||'').trim();
        if (idTp) {
          lastTp = idTp;
          filled.push(r);
        } else if (meterVal && lastTp) {
          const merged = Object.assign({}, r);
          setField(merged, 'ID_TP', lastTp);
          filled.push(merged);
        }
        // else: baris benar-benar kosong -- dilewati.
      });
      globalValidasiToday = filled.slice(-100).reverse();
    }
  } catch (err) {
    console.error('Gagal memuat data Validasi:', err);
    globalValidasiToday = [];
  }
  render();
}

// ==== SUBMIT DIGGING -- endpoint & skema kolom IDENTIK dgn dashboard.html ====
async function submitDiggingEntry(onStatus) {
  const f = diggingFormState;
  // BARU (28 Agu, "Submit Dulu Koreksi Nanti", menyusul web): Tujuan & assay SEKARANG
  // opsional -- Pit/Blok/Total Sampel/ID Sampel yang wajib, sama persis validasi backend
  // (yang sudah diperbarui utk fitur ini kemarin).
  if (!f.pit || !f.blok || !f.total_sampel || !f.id_sampel) {
    onStatus('Pit, Blok, Total Sampel, dan ID Sampel wajib diisi.', false);
    return false;
  }
  const smVal = computeSM(f.mgo, f.sio2);
  const tonase = computeTonase(f.total_sampel, f.tipe_ore, parseFloat(smVal));
  if (!tonase) {
    onStatus('Total Sampel belum valid, Tonase tidak bisa dihitung.', false);
    return false;
  }
  // BARU (28 Agu): Ni kosong -> Material "Menunggu Assay" (bukan diklasifikasi asal jadi
  // grade palsu dari Ni=0) -- sama persis logika yang sudah dipakai di web.
  const niRaw = String(f.ni || '').trim();
  let materialVal, tipeOreVal;
  if (!niRaw) {
    materialVal = 'Menunggu Assay';
    tipeOreVal = f.tipe_ore === 'Auto' ? 'Sapro' : f.tipe_ore;
  } else {
    const classify = classifyMaterial(f.ni, f.tipe_ore, smVal);
    materialVal = classify.classGrade;
    tipeOreVal = classify.tipeOreFinal;
  }
  onStatus('Menyimpan data...', true, true);
  try {
    const payload = buildAuthenticatedPayload({
      sheet_name: 'Produksi_GC',
      tanggal: todayDateStr(),
      shift: f.shift, cuaca: f.cuaca,
      pit: f.pit, blok: f.blok,
      material: materialVal, tipe_ore: tipeOreVal,
      id_sampel: f.id_sampel, total_sampel: f.total_sampel,
      tonase: tonase,
      ni: f.ni, fe: f.fe, co: f.co, mgo: f.mgo, sio2: f.sio2, sm: smVal,
      tujuan: f.tujuan, ship: f.tujuan === 'Direct' ? f.ship : ''
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      onStatus(result.auto_route ? ('Tersimpan -- ' + result.auto_route) : 'Data produksi berhasil disimpan!', true);
      return true;
    }
    throw new Error(result.message || 'Gagal menyimpan data produksi.');
  } catch (err) {
    console.error('Submit digging error:', err);
    onStatus(err.message || 'Terjadi kesalahan saat menyimpan.', false);
    return false;
  }
}

// ==== BARU (28 Agu, "Submit Dulu Koreksi Nanti" -- menyusul web): MODAL UPDATE HASIL
// ASSAY. Terhubung ke action updateAssayResult yang SUDAH ADA di backend sejak kemarin
// (dibangun bareng fitur ini utk web) -- di sini murni kerjaan Android, backend tidak
// perlu disentuh sama sekali.
let updateAssayModalOpen = false;
let updateAssayForm = { ni:'', fe:'', co:'', mgo:'', sio2:'', tipe_ore:'Sapro', tujuan:'', ship:'' };
let updateAssayStatusMsg = '', updateAssayStatusOk = true, updateAssayBusy = false;

function openUpdateAssayModal() {
  const r = diggingDisplayedRows[diggingDetailIndex];
  if (!r) return;
  updateAssayForm = { ni:'', fe:'', co:'', mgo:'', sio2:'', tipe_ore:'Sapro', tujuan:'', ship:'' };
  updateAssayStatusMsg = '';
  updateAssayModalOpen = true;
  render();
}
function closeUpdateAssayModal() { updateAssayModalOpen = false; render(); }
function updateAssayField(name, val) { updateAssayForm[name] = val; render(); }

function renderUpdateAssayModal() {
  if (!updateAssayModalOpen) return '';
  const r = diggingDisplayedRows[diggingDetailIndex];
  if (!r) return '';
  const f = updateAssayForm;
  // Tujuan cuma ditawarkan kalau baris ini BELUM pernah punya Tujuan -- kalau sudah
  // ada (mis. sudah EFO ke Dome tertentu), ganti Tujuan/Dome bukan cakupan modal ini.
  const tujuanBelumAda = !getField(r,'Tujuan') || getField(r,'Tujuan') === '-';
  const body =
    '<div class="rounded-[10px] bg-amber-500/10 border border-amber-500/25 px-3 py-2.5 text-[10px] text-amber-300 leading-relaxed mb-3">Isi hasil assay dari lab. Material akan dihitung ulang otomatis begitu Ni % diisi.</div>' +
    '<div class="grid grid-cols-3 gap-2.5">' +
      fieldRow('Ni %', numField('ni', f.ni, '1.85').replace(/updateDiggingField/g, 'updateAssayField')) +
      fieldRow('Fe %', numField('fe', f.fe, '12.40').replace(/updateDiggingField/g, 'updateAssayField')) +
      fieldRow('Co %', numField('co', f.co, '0.08').replace(/updateDiggingField/g, 'updateAssayField')) +
    '</div>' +
    '<div class="grid grid-cols-2 gap-2.5 mt-2.5">' +
      fieldRow('MgO %', numField('mgo', f.mgo, '28.50').replace(/updateDiggingField/g, 'updateAssayField')) +
      fieldRow('SiO2 %', numField('sio2', f.sio2, '38.20').replace(/updateDiggingField/g, 'updateAssayField')) +
    '</div>' +
    '<div class="mt-2.5">' + fieldRow('Tipe Ore', selectField('tipe_ore', ['Sapro','Limo','Auto'], f.tipe_ore).replace(/updateDiggingField/g, 'updateAssayField')) + '</div>' +
    (tujuanBelumAda ? '<div class="mt-2.5">' + fieldRow('Tujuan', selectField('tujuan', ['','EFO','ETO','Direct','Disposal'], f.tujuan).replace(/updateDiggingField/g, 'updateAssayField')) + '</div>' : '') +
    (tujuanBelumAda && f.tujuan === 'Direct' ? '<div class="mt-2.5">' + fieldRow('Nama Ship', textField('ship', f.ship, 'cth. MV Ocean Star').replace(/updateDiggingField/g, 'updateAssayField')) + '</div>' : '') +
    (updateAssayStatusMsg ? '<p class="text-xs font-medium mt-3 ' + (updateAssayStatusOk?'text-emerald-400':'text-rose-400') + '">' + updateAssayStatusMsg + '</p>' : '') +
    '<button onclick="handleSubmitUpdateAssay()" ' + (updateAssayBusy?'disabled':'') + ' class="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm py-3 rounded-xl disabled:opacity-60 mt-4">' +
      (updateAssayBusy ? '<span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full spin"></span>' : icon('save','w-4 h-4')) +
      '<span>' + (updateAssayBusy?'Menyimpan...':'Simpan Hasil Assay') + '</span>' +
    '</button>';
  return renderSimpleModal('Update Hasil Assay', getField(r,'ID Sampel') || '-', body, 'closeUpdateAssayModal()');
}

async function handleSubmitUpdateAssay() {
  const r = diggingDisplayedRows[diggingDetailIndex];
  const f = updateAssayForm;
  const idSampel = r ? getField(r,'ID Sampel') : '';
  if (!idSampel) { updateAssayStatusMsg = 'ID Sampel baris ini kosong, tidak bisa diupdate.'; updateAssayStatusOk = false; render(); return; }
  const niRaw = String(f.ni || '').trim();
  if (!niRaw) { updateAssayStatusMsg = 'Ni % wajib diisi untuk menyimpan hasil assay.'; updateAssayStatusOk = false; render(); return; }

  const smVal = computeSM(f.mgo, f.sio2);
  const classify = classifyMaterial(f.ni, f.tipe_ore, smVal);
  updateAssayBusy = true; updateAssayStatusMsg = ''; render();
  try {
    const payload = buildAuthenticatedPayload({
      action: 'updateAssayResult',
      id_sampel: idSampel,
      ni: f.ni, fe: f.fe, co: f.co, mgo: f.mgo, sio2: f.sio2, sm: smVal,
      material: classify.classGrade, tipe_ore: classify.tipeOreFinal,
      tujuan: f.tujuan || '', ship: f.tujuan === 'Direct' ? f.ship : ''
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status !== 'success') throw new Error(result.message || 'Gagal menyimpan hasil assay.');
    updateAssayStatusMsg = result.auto_route ? ('Tersimpan -- ' + result.auto_route) : 'Hasil assay berhasil disimpan!';
    updateAssayStatusOk = true;
    render();
    setTimeout(() => {
      closeUpdateAssayModal();
      closeDiggingDetail();
      loadRingkasanData();
    }, 900);
  } catch (err) {
    console.error('Update assay error:', err);
    updateAssayStatusMsg = err.message || 'Terjadi kesalahan saat menyimpan.';
    updateAssayStatusOk = false;
  }
  updateAssayBusy = false;
  render();
}

let chatModalOpen = false;
let chatMessages = [];
let chatLoading = false;
let chatErrorMsg = '';
let chatInputText = '';
let chatSendBusy = false;
let chatPollTimer = null;

async function fetchChatMessages(silent) {
  if (!silent) { chatLoading = true; chatErrorMsg = ''; render(); }
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=chat&limit=50&t=' + Date.now());
    const result = await response.json();
    if (result.status === 'error') {
      chatErrorMsg = result.message || 'Server menolak permintaan Chat.';
    } else {
      chatMessages = result.data || [];
      chatErrorMsg = '';
    }
  } catch (err) {
    chatErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
  }
  chatLoading = false;
  render();
  const list = document.getElementById('chat-scroll-list');
  if (list) list.scrollTop = list.scrollHeight;
}
async function openChatModal() {
  chatModalOpen = true;
  await fetchChatMessages(false);
  if (chatPollTimer) clearInterval(chatPollTimer);
  chatPollTimer = setInterval(() => { if (chatModalOpen) fetchChatMessages(true); }, 8000);
}
function closeChatModal() {
  chatModalOpen = false;
  if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
  render();
}
function updateChatInput(val) { chatInputText = val; }
async function submitChatMessage() {
  const text = chatInputText.trim();
  if (!text || chatSendBusy) return;
  chatSendBusy = true; render();
  try {
    const payload = buildAuthenticatedPayload({ sheet_name: 'ChatLog', message: text });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      chatInputText = '';
      await fetchChatMessages(true);
    } else {
      chatErrorMsg = result.message || 'Gagal mengirim pesan.';
    }
  } catch (err) {
    chatErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
  }
  chatSendBusy = false;
  render();
}
function renderChatModal() {
  if (!chatModalOpen) return '';
  let list;
  if (chatLoading) {
    list = '<div class="flex items-center justify-center py-10"><span class="w-6 h-6 border-2 border-white/20 border-t-[#2563eb] rounded-full spin"></span></div>';
  } else if (chatErrorMsg && !chatMessages.length) {
    list = '<div class="rounded-[12px] bg-rose-500/10 border border-rose-500/25 p-4 m-4"><div class="text-xs font-bold text-rose-300">Gagal memuat Chat</div><div class="text-[11px] text-rose-300/70 mt-1">' + chatErrorMsg + '</div></div>';
  } else if (!chatMessages.length) {
    list = '<div class="text-center text-white/40 text-xs py-10">Belum ada pesan. Mulai percakapan tim di bawah.</div>';
  } else {
    list = chatMessages.map(m => {

      return '<div class="mb-3 flex ' + (isMe ? 'justify-end' : 'justify-start') + '">' +

  }
  return '' +
  '<div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 flex items-end fade-in" onclick="if(event.target===this)closeChatModal()">' +
    '<div class="w-full max-w-[480px] mx-auto bg-[#0e1933] rounded-t-[24px] h-[80vh] flex flex-col border-t border-white/10">' +

        '<button onclick="closeChatModal()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">' + icon('x','w-4 h-4 text-white/50') + '</button>' +
      '</div>' +
      '<div id="chat-scroll-list" class="flex-1 min-h-0 overflow-y-auto px-4 py-3">' + list + '</div>' +
      (chatErrorMsg && chatMessages.length ? '<div class="shrink-0 px-4 pb-1 text-[10px] text-rose-400">' + chatErrorMsg + '</div>' : '') +
      '<div class="shrink-0 px-4 py-3 border-t border-white/[0.06] flex items-center gap-2">' +

// ==== HELPER: cari field di objek row tanpa peduli ejaan header persis
// (ID_TP vs "ID TP" vs "Id_Tp", dst) -- header sheet mentah, jangan diasumsikan pasti sama.
function getField(row, name) {
  if (!row) return '';
  const target = name.toLowerCase().replace(/[\s_]/g, '');
  for (const key in row) {
    if (key.toLowerCase().replace(/[\s_]/g, '') === target) return row[key];
  }
  return '';
}
function setField(row, name, value) {
  const target = name.toLowerCase().replace(/[\s_]/g, '');
  for (const key in row) {
    if (key.toLowerCase().replace(/[\s_]/g, '') === target) { row[key] = value; return; }
  }
  row[name] = value;
}
function sumField(rows, key) { return rows.reduce((s,r) => s + (parseFloat(r[key]) || 0), 0); }
function avgField(rows, key) { const vals = rows.map(r=>parseFloat(r[key])).filter(v=>!isNaN(v) && v>0); return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0; }

// ==== RENDER: VALIDASI ====
// FIX (26 Agu): 1 ID_TP di sheet Validasi punya BANYAK baris (1 baris per kedalaman
// meter yang diukur -- 1m, 2m, 3m dst). Sebelumnya tiap baris ditampilkan sbg entri
// terpisah (salah) -- sekarang dikelompokkan per ID_TP, sama persis pola dashboard
// web: kartu ringkasan pakai RATA-RATA semua kedalaman + Class Grade, detail per
// kedalaman baru dibuka lewat modal.
function numFieldGet(row, ...names) {
  for (const n of names) { const v = parseFloat(getField(row, n)); if (!isNaN(v)) return v; }
  return null;
}
function avgOf(arr) { const v = arr.filter(x => x !== null); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length) : null; }
function fmt2(v) { return v === null || v === undefined || isNaN(v) ? '-' : v.toFixed(2); }

function groupValidasiByTp(rows) {
  const map = {}, order = [];
  rows.forEach(r => {
    const idTp = String(getField(r,'ID_TP')||'').trim();
    if (!idTp) return;
    if (!map[idTp]) { map[idTp] = []; order.push(idTp); }
    map[idTp].push(r);
  });
  return order.map(idTp => {
    const depths = map[idTp].slice().sort((a,b) => (numFieldGet(a,'Meter')||0) - (numFieldGet(b,'Meter')||0));
    // Field umum per-TP (Area/Bench/Timur/Utara/Warna/Struktur) biasanya cuma diisi di
    // baris kedalaman pertama -- ambil dari baris manapun yang punya nilai non-kosong.
    function pickStatic(name) { const found = depths.find(d => String(getField(d,name)||'').trim()); return found ? getField(found,name) : ''; }
    const niArr = depths.map(d => numFieldGet(d,'Ni %','Ni'));
    const feArr = depths.map(d => numFieldGet(d,'Fe %','Fe'));
    const coArr = depths.map(d => numFieldGet(d,'Co %','Co'));
    const mgoArr = depths.map(d => numFieldGet(d,'MgO %','MgO'));
    const sio2Arr = depths.map(d => numFieldGet(d,'SiO2 %','SiO2'));
    const smArr = depths.map(d => numFieldGet(d,'SM %','SM'));
    const avgNi = avgOf(niArr), avgSm = avgOf(smArr);
    const tipeLateritRaw = String(pickStatic('Tipe_Laterit')||'').toLowerCase();
    const tipeOreMapped = tipeLateritRaw.indexOf('limo') >= 0 ? 'Limo' : 'Sapro';
    let classGrade = '-';
    if (avgNi !== null) { try { classGrade = classifyMaterial(avgNi, tipeOreMapped, avgSm).classGrade; } catch (e) {} }
    const depthValues = depths.map(d => numFieldGet(d,'Meter')).filter(v => v !== null);
    const maxDepth = depthValues.length ? Math.max(...depthValues) : 0;
    return {
      idTp, depths,
      area: pickStatic('Area'), bench: pickStatic('Bench'), timur: pickStatic('Timur'), utara: pickStatic('Utara'),
      warna: pickStatic('Warna'), struktur: pickStatic('Struktur'), tipeLaterit: pickStatic('Tipe_Laterit'),
      tanggal: pickStatic('Tanggal'), pelapor: pickStatic('Pelapor'),
      avgNi, avgFe: avgOf(feArr), avgCo: avgOf(coArr), avgMgo: avgOf(mgoArr), avgSio2: avgOf(sio2Arr), avgSm,
      classGrade, depthCount: depths.length, maxDepth
    };
  });
}

// 5 preset warna translucent+border, dibaca dari globalCOGConfig.Warna_<Grade> kalau
// Developer sudah kustomisasi lewat Settings, fallback ke default sama persis dgn master.
const GRADE_COLOR_PRESETS = {
  merah: { text: 'text-rose-400', bg: 'bg-rose-500/20', border: 'border-rose-500/30' },
  abu: { text: 'text-slate-400', bg: 'bg-slate-700/40', border: 'border-slate-600/40' },

};
const GRADE_COLOR_DEFAULTS = { Waste: 'abu', LG: 'kuning', MG: 'biru', HG: 'hijau', VHG: 'hijau' };
function getGradeColorPreset(classGrade) {
  const cfg = globalCOGConfig || {};
  const colorKey = cfg['Warna_' + classGrade] || GRADE_COLOR_DEFAULTS[classGrade] || 'abu';
  return GRADE_COLOR_PRESETS[colorKey] || GRADE_COLOR_PRESETS['abu'];
}
function renderClassGradeBadge(classGrade) {
  if (classGrade === 'N/A' || !classGrade || classGrade === '-') {

  return '<span class="px-2 py-0.5 rounded-md text-[11px] ' + preset.bg + ' ' + preset.text + ' border ' + preset.border + ' font-semibold">' + classGrade + '</span>';
}

// menolak otomatis kalau ID TP belum punya koordinat Plan -- pesan errornya

let validasiFormOpen = false;
let validasiFormState = { id_tp:'', area:'', bench:'', tipe_laterit:'', warna:'', struktur:'', meter:'', catatan:'', ni:'', fe:'', co:'', mgo:'', sio2:'', sm:'' };
let validasiSubmitStatusMsg = '', validasiSubmitOk = true, validasiSubmitBusy = false;

function openValidasiForm() {
  validasiFormOpen = true;
  validasiFormState = { id_tp:'', area:'', bench:'', tipe_laterit:'', warna:'', struktur:'', meter:'', catatan:'', ni:'', fe:'', co:'', mgo:'', sio2:'', sm:'' };
  validasiSubmitStatusMsg = '';
  render();
}
function closeValidasiForm() { validasiFormOpen = false; render(); }
function updateValidasiField(name, val) { validasiFormState[name] = val; render(); }

async function submitValidasiEntry() {
  const f = validasiFormState;
  if (!f.id_tp || !f.area) {
    validasiSubmitStatusMsg = 'ID TP dan Area wajib diisi.'; validasiSubmitOk = false; render(); return;
  }
  if (!f.meter) {
    validasiSubmitStatusMsg = 'Kedalaman (m) wajib dipilih -- 1 s/d 5 meter sesuai prosedur.'; validasiSubmitOk = false; render(); return;
  }
  validasiSubmitBusy = true; validasiSubmitStatusMsg = ''; render();
  try {
    const payload = buildAuthenticatedPayload({
      sheet_name: 'Validasi',
      tanggal: todayDateStr(),
      id_tp: f.id_tp, area: f.area, bench: f.bench,
      tipe_laterit: f.tipe_laterit, warna: f.warna, struktur: f.struktur,
      meter: f.meter, catatan: f.catatan,
      ni: f.ni, fe: f.fe, co: f.co, mgo: f.mgo, sio2: f.sio2, sm: f.sm
      // Timur/Utara SENGAJA tidak dikirim -- server otomatis pakai koordinat Plan
      // yang sudah ditetapkan Head/Developer utk ID TP ini.
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      validasiSubmitStatusMsg = 'Data Validasi berhasil disimpan!'; validasiSubmitOk = true; render();
      setTimeout(async () => { validasiFormOpen = false; await loadRingkasanData(); }, 800);
    } else {
      throw new Error(result.message || 'Gagal menyimpan data Validasi.');
    }
  } catch (err) {
    // Pesan error server (mis. "TP belum memiliki koordinat Plan...") ditampilkan
    // APA ADANYA -- ini bukan bug, itu memang aturan backend yg wajib dipatuhi.
    validasiSubmitStatusMsg = err.message || 'Terjadi kesalahan saat menyimpan.'; validasiSubmitOk = false;
  }
  validasiSubmitBusy = false;
  render();
}

// ==== MODAL: JOB SAFETY ANALYSIS & KONFIRMASI KEHADIRAN ====
// Endpoint asli: action=addJsaLog (sheet JSA_Log). Server idempotent per hari (1 member
// cuma bisa konfirmasi 1x/hari, percobaan kedua dibalas denied:true dgn pesan ramah,
// BUKAN error) dan OTOMATIS menambah counter Absensi_Hadir/Izin/Cuti di sheet Member --
// makanya setelah sukses kita panggil refreshKpiOnly() supaya KPI modal ikut ter-update.
const JSA_DOC_NO = 'JSA-MINEGEO-2026-REV02'; // No dokumen JSA aktif -- update manual kalau revisi berganti.
let jsaModalOpen = false;
let jsaSubmitBusy = false;
let jsaSubmitStatusMsg = '';
let jsaSubmitOk = true;
let jsaConfirmedToday = false;
// BARU (v90.2.112): state checklist APD -- 4 item INDEPENDEN dari Status_Kehadiran, dicentang
// manual per-item oleh member sendiri. HANYA 4 item ini yg dikirim ke backend (kolom
// APD_Helm/APD_Masker/APD_Sarung_Tangan/APD_Rompi di JSA_Log) -- 4 item lain (Kacamata/Safety
// Boots/Life Jacket/Earplug) tetap tampil sbg referensi teks saja, backend belum punya kolomnya.
let jsaApdChecked = { helm: false, masker: false, sarung_tangan: false, rompi: false };

function toggleJsaApd(key) {
  jsaApdChecked[key] = !jsaApdChecked[key];
  render();
}

function openJsaModal() {
  jsaModalOpen = true;
  jsaSubmitStatusMsg = ''; jsaConfirmedToday = false;
  jsaApdChecked = { helm: false, masker: false, sarung_tangan: false, rompi: false };
  render();
}
function closeJsaModal() { jsaModalOpen = false; render(); }

async function submitJsaConfirm(status) {
  if (!sessionInfo) { openLoginModal(); return; }
  jsaSubmitBusy = true; jsaSubmitStatusMsg = ''; render();
  try {
    const payload = buildAuthenticatedPayload({
      action: 'addJsaLog', jsa_no: JSA_DOC_NO, attendance_status: status,
      apd_helm: jsaApdChecked.helm ? 'Y' : 'N',
      apd_masker: jsaApdChecked.masker ? 'Y' : 'N',
      apd_sarung_tangan: jsaApdChecked.sarung_tangan ? 'Y' : 'N',
      apd_rompi: jsaApdChecked.rompi ? 'Y' : 'N'
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      if (result.denied) {
        jsaSubmitStatusMsg = result.message || 'Kehadiran Anda sudah tercatat hari ini.';
        jsaSubmitOk = true;
        jsaConfirmedToday = true;
      } else {
        jsaSubmitStatusMsg = 'Kehadiran (' + status + ') berhasil dikonfirmasi!';
        jsaSubmitOk = true;
        jsaConfirmedToday = true;
        await refreshKpiOnly(); // sinkron langsung -- Absensi Hadir/Izin/Cuti di KPI ikut update
      }
    } else {
      jsaSubmitStatusMsg = result.message || 'Gagal mengonfirmasi kehadiran.';
      jsaSubmitOk = false;
    }
  } catch (err) {
    jsaSubmitStatusMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
    jsaSubmitOk = false;
  }
  jsaSubmitBusy = false;
  render();
}

  // -- input checkbox asli akan reset fokus/state visual tiap render() dipanggil ulang.
  function apdCheckbox(key, label) {
    const checked = !!jsaApdChecked[key];
    return '<div onclick="toggleJsaApd(\'' + key + '\')" class="flex items-center gap-2 px-3 py-2.5 rounded-[8px] cursor-pointer border transition-all ' +
      (checked ? 'bg-emerald-500/15 border-emerald-500/40' : 'bg-white/[0.03] border-white/[0.06]') + '">' +

      (checked ? 'bg-emerald-500 border-emerald-500' : 'border-white/25') + '">' +
      (checked ? icon('check','w-3 h-3 text-white') : '') +
      '</span><span class="text-[11px] font-medium ' + (checked ? 'text-emerald-300' : 'text-white/70') + '">' + label + '</span></div>';
  }
  let body = '<div class="rounded-[12px] bg-[#0b1329] border border-white/[0.08] p-4 mb-3">' +
    '<div class="flex items-center gap-2 mb-2">' +
      '<span class="text-[9px] font-bold px-2 py-1 rounded-full bg-[#2563eb]/15 text-blue-300 border border-[#2563eb]/25">' + JSA_DOC_NO + '</span>' +
    '</div>' +
    '<div class="text-white font-black text-base leading-tight mb-1">JOB SAFETY ANALYSIS</div>' +
    '<div class="text-[11px] text-white/40 mb-3">Division Mine Geologist &bull; Pit, Stockpile &amp; Jetty</div>' +
    '<div class="text-[11px] text-white/60 leading-relaxed">Pekerjaan Mine Geologist mencakup validasi block model, pengambilan sampel grade control, supervisi penggalian, pengawasan barging shipment, hingga entry data dashboard -- di area pit aktif &amp; jetty dengan risiko heavy equipment dan geoteknis.</div>' +
  '</div>';
  body += '<div class="mb-3"><div class="text-[10px] font-bold text-white/40 tracking-wide mb-2">APD WAJIB (MINIMUM) -- centang sebelum konfirmasi Hadir</div><div class="grid grid-cols-2 gap-1.5">' +
    apdCheckbox('helm', 'Helm Safety (SNI)') + apdItem('Kacamata Safety') +
    apdCheckbox('masker', 'Masker P2 / N95') + apdCheckbox('sarung_tangan', 'Sarung Tangan') +
    apdItem('Safety Boots Steel') + apdCheckbox('rompi', 'Rompi Reflektif') +
    apdItem('Life Jacket (Jetty)') + apdItem('Earplug (Area Bising)') +
  '</div></div>';
  body += '<div class="rounded-[10px] bg-amber-500/10 border border-amber-500/25 px-3 py-2.5 text-[10px] text-amber-300 mb-4">Dokumen ini WAJIB dibaca sebelum mulai bekerja (toolbox meeting). Konfirmasi kehadiran di bawah ini akan tercatat dgn nama &amp; waktu dari sesi login Anda -- tidak bisa diwakilkan.</div>';
  body += '<div class="text-[10px] font-bold text-white/40 tracking-wide mb-2">TTD &amp; KONFIRMASI KEHADIRAN</div>';
  if (jsaSubmitStatusMsg) {
    body += '<p class="text-xs font-medium mb-2 ' + (jsaSubmitOk?'text-emerald-400':'text-rose-400') + '">' + jsaSubmitStatusMsg + '</p>';
  }
  if (!jsaConfirmedToday) {
    body += '<div class="grid grid-cols-3 gap-2">' +
      '<button onclick="submitJsaConfirm(\'Hadir\')" ' + (jsaSubmitBusy?'disabled':'') + ' class="flex flex-col items-center gap-1 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold text-xs disabled:opacity-60">' + icon('check-circle-2','w-4 h-4') + '<span>Hadir</span></button>' +

      '<button onclick="submitJsaConfirm(\'Cuti\')" ' + (jsaSubmitBusy?'disabled':'') + ' class="flex flex-col items-center gap-1 py-3 rounded-xl bg-white/10 text-white font-bold text-xs disabled:opacity-60">' + icon('calendar-x','w-4 h-4') + '<span>Cuti</span></button>' +
    '</div>';
    if (jsaSubmitBusy) body += '<div class="flex items-center justify-center mt-3"><span class="w-5 h-5 border-2 border-white/20 border-t-[#2563eb] rounded-full spin"></span></div>';
  }
  return renderSimpleModal('Job Safety Analysis', 'Mine Geologist', body, 'closeJsaModal()');
}

async function submitIssueEntry() {
  const f = issueFormState;
  if (!f.masalah || !f.lokasi || !f.pic) {
    issueSubmitStatusMsg = 'Masalah, Lokasi, dan PIC wajib diisi.'; issueSubmitOk = false; render(); return;
  }
  issueSubmitBusy = true; issueSubmitStatusMsg = ''; render();
  try {
    const now = new Date();
    const payload = buildAuthenticatedPayload({
      sheet_name: 'Masalah & Rekomendasi',
      tanggal: todayDateStr(),
      waktu: now.toTimeString().slice(0,5),
      masalah: f.masalah, lokasi: f.lokasi, dampak: f.dampak,
      rekomendasi: f.rekomendasi, pic: f.pic, target: f.target, status: f.status
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      issueSubmitStatusMsg = 'Issue berhasil disimpan!'; issueSubmitOk = true; render();
      setTimeout(async () => { issueFormOpen = false; await openIssueModal(); }, 800);
    } else {
      throw new Error(result.message || 'Gagal menyimpan issue.');
    }
  } catch (err) {
    issueSubmitStatusMsg = err.message || 'Terjadi kesalahan saat menyimpan.'; issueSubmitOk = false;
  }
  issueSubmitBusy = false;
  render();
}

// ==== MENU AKUN (dipicu dari avatar header) ====
// ==== BARU (27 Agu): FOTO PROFIL LOKAL -- Member pilih foto dari galeri Android,
// disimpan di localStorage HP itu SENDIRI (base64, dikompres dulu via canvas supaya
// hemat kuota), kunci disimpan per Login_ID (bukan 1 kunci global) supaya kalau ganti
// akun di HP yang sama, fotonya tidak tertukar. TIDAK PERNAH terupload ke server --
// murni preferensi lokal per perangkat. Karena PWA (bukan app native), app TIDAK BISA
// otomatis tahu kalau foto aslinya dihapus dari galeri Android -- makanya disediakan
// tombol "Copot Foto" di dalam app sebagai satu-satunya cara pasti menghapusnya.
function getCustomAvatarStorageKey() {
  const loginId = (localStorage.getItem('mine_member_login_id') || 'guest').trim();
  return 'mine_member_avatar_custom_' + loginId;
}
function getCustomAvatarDataUrl() {
  try { return localStorage.getItem(getCustomAvatarStorageKey()) || ''; } catch (e) { return ''; }
}
function getMemberInitials() {
  const name = (sessionInfo && sessionInfo.userName) ? sessionInfo.userName.trim() : '';
  if (!name) return '';
  return name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function handleAvatarFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  const statusEl = document.getElementById('avatar-status-msg');
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    if (statusEl) { statusEl.textContent = 'File yang dipilih bukan gambar.'; statusEl.className = 'text-[10px] mt-2 text-rose-400'; statusEl.classList.remove('hidden'); }
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // Kompres + resize ke maksimal 256x256 sebelum disimpan -- foto asli dari kamera
      // HP modern bisa >5MB, jauh melebihi kuota localStorage (~5-10MB total per app).
      const canvas = document.createElement('canvas');
      const maxSize = 256;
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
      else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
      try {
        localStorage.setItem(getCustomAvatarStorageKey(), compressedDataUrl);
        if (statusEl) { statusEl.textContent = 'Foto tersimpan di HP ini.'; statusEl.className = 'text-[10px] mt-2 text-emerald-400'; statusEl.classList.remove('hidden'); }
        render();
      } catch (err) {
        if (statusEl) { statusEl.textContent = 'Gagal menyimpan -- ruang penyimpanan HP penuh.'; statusEl.className = 'text-[10px] mt-2 text-rose-400'; statusEl.classList.remove('hidden'); }
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = ''; // reset supaya bisa pilih file yg sama lagi kalau mau
}
function removeCustomAvatar() {
  try { localStorage.removeItem(getCustomAvatarStorageKey()); } catch (e) {}
  render();
}

// sesi ini ditandai LOGOUT di sheet Sessions -- sebelumnya cuma dihapus di HP sendiri,
// server masih menganggap sesi "aktif" sampai idle-timeout alami habis (nyambung
// langsung ke fix Active User Indicator yang dikerjakan hari ini di web dashboard).
// Best-effort, timeout pendek -- gagal pun tetap lanjut logout, jangan sampai macet

// (avatar, polling chat, dsb) benar2 hilang total, bukan cuma di-render ulang di tempat.
async function handleLogout() {
  if (sessionInfo && sessionInfo.token) {

}
