// ==== FETCH HELPERS -- 1 MASTER: URL & pola auth sama persis dgn dashboard web ====
function withReadAuthToken(url) {
  if (!sessionInfo) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'sessionToken=' + encodeURIComponent(sessionInfo.token);
}
async function fetchWithTimeout(url, options, timeoutMs) {
  options = options || {};
  timeoutMs = timeoutMs || 20000;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const method = String(options.method || 'GET').toUpperCase();
    const requestUrl = method === 'GET' ? withReadAuthToken(url) : url;
    return await fetch(requestUrl, Object.assign({}, options, { signal: controller.signal }));
  } finally {
    clearTimeout(timer);
  }
}
function buildAuthenticatedPayload(fields) {
  const payload = new URLSearchParams(fields);
  if (sessionInfo) payload.set('sessionToken', sessionInfo.token);
  return payload;
}

// ==== LOGIN (verifyMemberPin) -- endpoint & field SAMA PERSIS dgn dashboard web ====
async function submitLogin(loginId, email, pin, onStatus) {
  if (loginInFlight) return;
  if (!loginId || !email || !/^[0-9]{6}$/.test(pin)) {
    onStatus('Login_ID, email terdaftar, dan PIN 6 digit wajib diisi.', false);
    return;
  }
  loginInFlight = true;
  onStatus('Memeriksa akun member...', true, true);
  try {
    const payload = new URLSearchParams({
      action: 'verifyMemberPin',
      login_id: loginId,
      email: email,
      pin: pin,
      client_info: (navigator.userAgent || '').slice(0, 180)
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (!result.success || !result.token) {
      if (result.locked && result.retry_after) {
        onStatus('Credential terkunci. Coba lagi dalam ' + result.retry_after + ' detik.', false);
      } else if (result.rate_limited || result.brute_force_blocked) {
        onStatus('Terlalu banyak percobaan. Coba lagi sebentar lagi.', false);
      } else {
        onStatus(result.message || 'Login member gagal.', false);
      }
      return;
    }
    saveSession(result, loginId);
    onStatus('Login berhasil sebagai ' + sessionInfo.userName + '.', true);
    setTimeout(() => { loginModalOpen = false; render(); loadRingkasanData(); }, 500);
  } catch (err) {
    console.error('Login error:', err);
    onStatus('Tidak bisa menghubungi server. Coba lagi.', false);
  } finally {
    loginInFlight = false;
  }
}

// ==== COGConfig (fetch live -- BUKAN hardcode, sama sumber dgn dashboard web) ====
async function fetchCOGConfig() {
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=cogconfig&t=' + Date.now());
    const result = await response.json();
    if (result.status !== 'success') throw new Error(result.message || 'Gagal memuat COGConfig');
    const rows = result.data || [];
    const cfg = { Sapro: null, Limo: null, Limo_Aktif: false, SM_Threshold_AutoDetect: 3, Bucket_per_Sampel: 8 };
    rows.forEach(row => {
      const tipe = (row['Tipe_Ore'] || '').toString().trim();
      const batas = {
        Batas_Waste_LG: parseFloat(row['Batas_Waste_LG']),
        Batas_LG_MG: parseFloat(row['Batas_LG_MG']),
        Batas_MG_HG: parseFloat(row['Batas_MG_HG']),
        Batas_HG_VHG: parseFloat(row['Batas_HG_VHG']),
        WMT_per_Bucket: (row['WMT_per_Bucket'] !== undefined && row['WMT_per_Bucket'] !== '' && !isNaN(parseFloat(row['WMT_per_Bucket']))) ? parseFloat(row['WMT_per_Bucket']) : 2.2
      };
      if (tipe === 'Sapro') cfg.Sapro = batas;
      if (tipe === 'Limo') cfg.Limo = batas;
      if (row['Limo_Aktif'] !== undefined && row['Limo_Aktif'] !== '') cfg.Limo_Aktif = String(row['Limo_Aktif']).trim().toUpperCase() === 'TRUE';
      if (row['SM_Threshold_AutoDetect'] !== undefined && row['SM_Threshold_AutoDetect'] !== '') { const v = parseFloat(row['SM_Threshold_AutoDetect']); if (!isNaN(v)) cfg.SM_Threshold_AutoDetect = v; }
      if (row['Bucket_per_Sampel'] !== undefined && row['Bucket_per_Sampel'] !== '') { const v = parseFloat(row['Bucket_per_Sampel']); if (!isNaN(v)) cfg.Bucket_per_Sampel = v; }
    });
    if (!cfg.Sapro) cfg.Sapro = { Batas_Waste_LG:0.8, Batas_LG_MG:1.25, Batas_MG_HG:1.45, Batas_HG_VHG:1.7, WMT_per_Bucket:2.2 };
    if (!cfg.Limo) cfg.Limo = { Batas_Waste_LG:0.8, Batas_LG_MG:1.25, Batas_MG_HG:1.45, Batas_HG_VHG:1.7, WMT_per_Bucket:2.2 };
    globalCOGConfig = cfg;
  } catch (err) {
    console.error('Gagal memuat COGConfig, pakai fallback:', err);
    globalCOGConfig = { Sapro:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7,WMT_per_Bucket:2.2}, Limo:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7,WMT_per_Bucket:2.2}, Limo_Aktif:false, SM_Threshold_AutoDetect:3, Bucket_per_Sampel:8 };
  }
}

// ==== classifyMaterial() -- LOGIC IDENTIK dgn dashboard.html, jangan pernah menyimpang ====
function classifyMaterial(ni, tipeOreInput, smValue) {
  const niNum = parseFloat(ni) || 0;
  const cfg = globalCOGConfig || { Sapro:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7}, Limo:{Batas_Waste_LG:0.8,Batas_LG_MG:1.25,Batas_MG_HG:1.45,Batas_HG_VHG:1.7}, Limo_Aktif:false, SM_Threshold_AutoDetect:3 };
  let tipeOreFinal = (tipeOreInput || 'Sapro').trim();
  if (!cfg.Limo_Aktif) {
    tipeOreFinal = 'Sapro';
  } else if (tipeOreFinal === 'Auto') {
    const sm = parseFloat(smValue) || 0;
    tipeOreFinal = (sm >= cfg.SM_Threshold_AutoDetect) ? 'Limo' : 'Sapro';
  } else if (tipeOreFinal !== 'Sapro' && tipeOreFinal !== 'Limo') {
    tipeOreFinal = 'Sapro';
  }
  const batas = cfg[tipeOreFinal] || cfg.Sapro;
  let classGrade;
  if (niNum <= 0) classGrade = 'N/A';
  else if (niNum < batas.Batas_Waste_LG) classGrade = 'Waste';
  else if (niNum < batas.Batas_LG_MG) classGrade = 'LG';
  else if (niNum < batas.Batas_MG_HG) classGrade = 'MG';
  else if (niNum < batas.Batas_HG_VHG) classGrade = 'HG';
  else classGrade = 'VHG';
  return { classGrade, tipeOreFinal };
}
// Tonase = Total Sampel x Bucket_per_Sampel x WMT_per_Bucket -- IDENTIK dgn updateDiggingTonaseAuto() web
function computeTonase(totalSampel, tipeOreSelected, smVal) {
  const cfg = globalCOGConfig || { Sapro:{WMT_per_Bucket:2.2}, Limo:{WMT_per_Bucket:2.2}, Limo_Aktif:false, SM_Threshold_AutoDetect:3, Bucket_per_Sampel:8 };
  const ts = parseFloat(totalSampel);
  if (isNaN(ts) || ts <= 0) return '';
  let tipeOreFinal = tipeOreSelected;
  if (!cfg.Limo_Aktif) tipeOreFinal = 'Sapro';
  else if (tipeOreSelected === 'Auto') tipeOreFinal = (!isNaN(smVal) && smVal >= (cfg.SM_Threshold_AutoDetect || 3)) ? 'Limo' : 'Sapro';
  else if (tipeOreSelected !== 'Sapro' && tipeOreSelected !== 'Limo') tipeOreFinal = 'Sapro';
  const wmt = (cfg[tipeOreFinal] && cfg[tipeOreFinal].WMT_per_Bucket) || 2.2;
  const bucketPerSampel = cfg.Bucket_per_Sampel || 8;
  return (ts * bucketPerSampel * wmt).toFixed(2);
}
function computeSM(mgo, sio2) {
  const m = parseFloat(mgo), s = parseFloat(sio2);
  if (!isNaN(m) && m > 0 && !isNaN(s)) return (s / m).toFixed(2);
  return '';
}

// ==== DATA: Digging (Produksi_GC) hari ini ====
function todayDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
let dataLoadErrorMsg = ''; // ditampilkan di UI kalau fetch Produksi gagal/ditolak server
// v90.2.115 FIX (temuan audit #1/#2 -- state Peta bisa nyangkut data lama): SEBELUMNYA
// error Validasi TIDAK mengosongkan globalValidasiFullForMap (dataset Peta lama tetap

let mapDataErrorMsg = '';
let diggingViewMode = 'today'; // 'today' kalau ada data hari ini, 'recent' kalau fallback ke entri terbaru
// v90.2.115 FIX (temuan audit #6 -- race condition): SEBELUMNYA tidak ada sequence guard --
// 2 panggilan loadRingkasanData() tumpang tindih (mis. submit form cepat berturut-turut)
// bisa membuat response LEBIH LAMA menimpa hasil response LEBIH BARU, tergantung urutan
// selesai (bukan urutan mulai). Pola sama persis dgn produksiFetchRequestSeq di dashboard.
let ringkasanFetchSeq = 0;
async function loadRingkasanData() {
  const mySeq = ++ringkasanFetchSeq;
  dataLoadErrorMsg = '';
  mapDataErrorMsg = '';
  await fetchCOGConfig();
  if (mySeq !== ringkasanFetchSeq) return; // ada panggilan lebih baru, buang hasil basi ini
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=produksi&t=' + Date.now());
    const result = await response.json();
    if (mySeq !== ringkasanFetchSeq) return;
    if (result.status === 'error') {
      // Server merespons 200 tapi menolak permintaan (mis. Unauthorized krn belum ada
      // sessionToken selama Login ditunda) -- ini BUKAN "data kosong", tampilkan apa adanya.
      dataLoadErrorMsg = result.message || 'Server menolak permintaan data.';
      globalDiggingToday = [];
    } else {
      const rows = result.data || [];
      const todayLabel = new Date().toDateString();
      const todaysRows = rows.filter(r => {
        const t = r['Tanggal'];
        if (!t) return false;
        const dt = new Date(t);
        return !isNaN(dt) && dt.toDateString() === todayLabel;
      });
      if (todaysRows.length) {
        globalDiggingToday = todaysRows;
        diggingViewMode = 'today';
      } else {
        // FALLBACK: belum ada entri persis hari ini -- daripada tampil kosong total (bikin
        // seolah data tidak tersinkron), tampilkan entri TERBARU yang sudah tercatat di
        // sheet, diurutkan tanggal terbaru dulu. UI menandai ini beda dari "hari ini".
        const sorted = rows.slice().sort((a, b) => new Date(b['Tanggal']) - new Date(a['Tanggal']));
        globalDiggingToday = sorted.slice(0, 15);
        diggingViewMode = 'recent';
      }
    }
  } catch (err) {
    if (mySeq !== ringkasanFetchSeq) return;
    console.error('Gagal memuat data Digging:', err);
    dataLoadErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
    globalDiggingToday = [];
  }
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=validasi&t=' + Date.now());
    const result = await response.json();
    if (mySeq !== ringkasanFetchSeq) return;
    if (result.status === 'error') {
      globalValidasiToday = [];
      globalValidasiFullForMap = []; // v90.2.115 FIX #1: dataset Peta ikut dikosongkan, jangan nyangkut data lama
      mapDataErrorMsg = result.message || 'Server menolak permintaan data Validasi.';
    } else {
      // FIX (27 Agu): baris kedalaman lanjutan (2m/3m/4m/5m) SENGAJA punya ID_TP kosong
      // di sheet asli -- cuma kedalaman pertama yang diisi ID_TP/Area/Bench/dst, baris
      // berikutnya cuma punya Meter+assay. Filter lama ("wajib ID_TP terisi") salah buang
      // baris-baris ini. Sekarang pakai forward-fill: baris kosong ID_TP tapi PUNYA nilai
      // Meter mewarisi ID_TP dari baris TP terakhir di atasnya (urutan sheet asli, SEBELUM
      // dibalik/reverse). Baris yang benar-benar kosong (tanpa ID_TP maupun Meter) tetap
      // dibuang -- itu baris sampah formula/formatting leftover yang sudah difilter sejak awal.
      const rawRows = result.data || [];
      let lastTp = '';
      const filled = [];
      rawRows.forEach(r => {
        const idTp = String(getField(r,'ID_TP')||'').trim();
        const meterVal = String(getField(r,'Meter')||'').trim();
        if (idTp) {
          lastTp = idTp;
          filled.push(r);
        } else if (meterVal && lastTp) {
          const merged = Object.assign({}, r);
          setField(merged, 'ID_TP', lastTp);
          filled.push(merged);
        }
        // else: baris benar-benar kosong -- dilewati.
      });
      globalValidasiFullForMap = filled.slice(); // v90.2.113 (Peta): SALINAN UTUH, sengaja TIDAK
      // ikut .slice(-100) di bawah -- Peta butuh SEMUA titik TP, bukan cuma 100 baris terakhir
      // yg ditampilkan tab Validasi. "Filter Peta jangan warisi limit tab lain" (poin desain #5).
      globalValidasiToday = filled.slice(-100).reverse();
    }
  } catch (err) {
    if (mySeq !== ringkasanFetchSeq) return;
    console.error('Gagal memuat data Validasi:', err);
    globalValidasiToday = [];
    globalValidasiFullForMap = []; // v90.2.115 FIX #1: dataset Peta ikut dikosongkan saat gagal
    mapDataErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
  }
  render();
}

// ==== SUBMIT DIGGING -- endpoint & skema kolom IDENTIK dgn dashboard.html ====
async function submitDiggingEntry(onStatus) {
  const f = diggingFormState;
  // BARU (28 Agu, "Submit Dulu Koreksi Nanti", menyusul web): Tujuan & assay SEKARANG
  // opsional -- Pit/Blok/Total Sampel/ID Sampel yang wajib, sama persis validasi backend
  // (yang sudah diperbarui utk fitur ini kemarin).
  if (!f.pit || !f.blok || !f.total_sampel || !f.id_sampel) {
    onStatus('Pit, Blok, Total Sampel, dan ID Sampel wajib diisi.', false);
    return false;
  }
  const smVal = computeSM(f.mgo, f.sio2);
  const tonase = computeTonase(f.total_sampel, f.tipe_ore, parseFloat(smVal));
  if (!tonase) {
    onStatus('Total Sampel belum valid, Tonase tidak bisa dihitung.', false);
    return false;
  }
  // BARU (28 Agu): Ni kosong -> Material "Menunggu Assay" (bukan diklasifikasi asal jadi
  // grade palsu dari Ni=0) -- sama persis logika yang sudah dipakai di web.
  const niRaw = String(f.ni || '').trim();
  let materialVal, tipeOreVal;
  if (!niRaw) {
    materialVal = 'Menunggu Assay';
    tipeOreVal = f.tipe_ore === 'Auto' ? 'Sapro' : f.tipe_ore;
  } else {
    const classify = classifyMaterial(f.ni, f.tipe_ore, smVal);
    materialVal = classify.classGrade;
    tipeOreVal = classify.tipeOreFinal;
  }
  onStatus('Menyimpan data...', true, true);
  try {
    const payload = buildAuthenticatedPayload({
      sheet_name: 'Produksi_GC',
      tanggal: todayDateStr(),
      shift: f.shift, cuaca: f.cuaca,
      pit: f.pit, blok: f.blok,
      material: materialVal, tipe_ore: tipeOreVal,
      id_sampel: f.id_sampel, total_sampel: f.total_sampel,
      tonase: tonase,
      ni: f.ni, fe: f.fe, co: f.co, mgo: f.mgo, sio2: f.sio2, sm: smVal,
      tujuan: f.tujuan, ship: f.tujuan === 'Direct' ? f.ship : ''
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      onStatus(result.auto_route ? ('Tersimpan -- ' + result.auto_route) : 'Data produksi berhasil disimpan!', true);
      return true;
    }
    throw new Error(result.message || 'Gagal menyimpan data produksi.');
  } catch (err) {
    console.error('Submit digging error:', err);
    onStatus(err.message || 'Terjadi kesalahan saat menyimpan.', false);
    return false;
  }
}

async function handleSubmitUpdateAssay() {
  const r = diggingDisplayedRows[diggingDetailIndex];
  const f = updateAssayForm;
  const idSampel = r ? getField(r,'ID Sampel') : '';
  if (!idSampel) { updateAssayStatusMsg = 'ID Sampel baris ini kosong, tidak bisa diupdate.'; updateAssayStatusOk = false; render(); return; }
  const niRaw = String(f.ni || '').trim();
  if (!niRaw) { updateAssayStatusMsg = 'Ni % wajib diisi untuk menyimpan hasil assay.'; updateAssayStatusOk = false; render(); return; }

  const smVal = computeSM(f.mgo, f.sio2);
  const classify = classifyMaterial(f.ni, f.tipe_ore, smVal);
  updateAssayBusy = true; updateAssayStatusMsg = ''; render();
  try {
    const payload = buildAuthenticatedPayload({
      action: 'updateAssayResult',
      id_sampel: idSampel,
      ni: f.ni, fe: f.fe, co: f.co, mgo: f.mgo, sio2: f.sio2, sm: smVal,
      material: classify.classGrade, tipe_ore: classify.tipeOreFinal,
      tujuan: f.tujuan || '', ship: f.tujuan === 'Direct' ? f.ship : ''
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status !== 'success') throw new Error(result.message || 'Gagal menyimpan hasil assay.');
    updateAssayStatusMsg = result.auto_route ? ('Tersimpan -- ' + result.auto_route) : 'Hasil assay berhasil disimpan!';
    updateAssayStatusOk = true;
    render();
    setTimeout(() => {
      closeUpdateAssayModal();
      closeDiggingDetail();
      loadRingkasanData();
    }, 900);
  } catch (err) {
    console.error('Update assay error:', err);
    updateAssayStatusMsg = err.message || 'Terjadi kesalahan saat menyimpan.';
    updateAssayStatusOk = false;
  }
  updateAssayBusy = false;
  render();
}

// ==== MODAL: CHAT TIM (data ASLI dari sheet ChatLog, poll berkala selagi modal terbuka) ====
let chatModalOpen = false;
let chatMessages = [];
let chatLoading = false;
let chatErrorMsg = '';
let chatInputText = '';
let chatSendBusy = false;
let chatPollTimer = null;

async function fetchChatMessages(silent) {
  if (!silent) { chatLoading = true; chatErrorMsg = ''; render(); }
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=chat&limit=50&t=' + Date.now());
    const result = await response.json();
    if (result.status === 'error') {
      chatErrorMsg = result.message || 'Server menolak permintaan Chat.';
    } else {
      chatMessages = result.data || [];
      chatErrorMsg = '';
    }
  } catch (err) {
    chatErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
  }
  chatLoading = false;
  render();
  const list = document.getElementById('chat-scroll-list');
  if (list) list.scrollTop = list.scrollHeight;
}
async function openChatModal() {
  chatModalOpen = true;
  await fetchChatMessages(false);
  if (chatPollTimer) clearInterval(chatPollTimer);
  chatPollTimer = setInterval(() => { if (chatModalOpen) fetchChatMessages(true); }, 8000);
}
function closeChatModal() {
  chatModalOpen = false;
  if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
  render();
}
function updateChatInput(val) { chatInputText = val; }
async function submitChatMessage() {
  const text = chatInputText.trim();
  if (!text || chatSendBusy) return;
  chatSendBusy = true; render();
  try {
    const payload = buildAuthenticatedPayload({ sheet_name: 'ChatLog', message: text });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      chatInputText = '';
      await fetchChatMessages(true);
    } else {
      chatErrorMsg = result.message || 'Gagal mengirim pesan.';
    }
  } catch (err) {
    chatErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
  }
  chatSendBusy = false;
  render();
}
function renderChatModal(justOpened) {
  if (!chatModalOpen) return '';
  const animClass = (justOpened === false) ? '' : ' fade-in';
  let list;
  if (chatLoading) {
    list = '<div class="flex items-center justify-center py-10"><span class="w-6 h-6 border-2 border-white/20 border-t-[#2563eb] rounded-full spin"></span></div>';
  } else if (chatErrorMsg && !chatMessages.length) {
    list = '<div class="rounded-[12px] bg-rose-500/10 border border-rose-500/25 p-4 m-4"><div class="text-xs font-bold text-rose-300">Gagal memuat Chat</div><div class="text-[11px] text-rose-300/70 mt-1">' + chatErrorMsg + '</div></div>';
  } else if (!chatMessages.length) {
    list = '<div class="text-center text-white/40 text-xs py-10">Belum ada pesan. Mulai percakapan tim di bawah.</div>';
  } else {
    list = chatMessages.map(m => {
      const isMe = sessionInfo && String(m.sender||'').trim().toLowerCase() === String(sessionInfo.userName||'').trim().toLowerCase();
      return '<div class="mb-3 flex ' + (isMe ? 'justify-end' : 'justify-start') + '">' +
        '<div class="max-w-[78%] ' + (isMe ? 'bg-[#2563eb]' : 'bg-[#0b1329] border border-white/[0.08]') + ' rounded-[14px] px-3.5 py-2.5">' +
          (!isMe ? '<div class="text-[10px] font-bold text-blue-300 mb-0.5">' + (m.sender||'Anonim') + (m.role ? (' &bull; ' + m.role) : '') + '</div>' : '') +
          '<div class="text-[13px] text-white leading-snug break-words">' + String(m.message||'').replace(/</g,'&lt;') + '</div>' +
          '<div class="text-[9px] ' + (isMe ? 'text-white/60' : 'text-white/30') + ' mt-1 text-right">' + (m.timestamp||'') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  return '' +
  '<div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 flex items-end' + animClass + '" onclick="if(event.target===this)closeChatModal()">' +
    '<div class="w-full max-w-[480px] mx-auto bg-[#0e1933] rounded-t-[24px] h-[80vh] flex flex-col border-t border-white/10">' +
      '<div class="shrink-0 px-5 pt-5 pb-3 border-b border-white/[0.06] flex items-center justify-between">' +
        '<div><div class="text-sm font-bold text-white">Chat Tim</div><div class="text-[10px] text-white/35">' + chatMessages.length + ' pesan terbaru</div></div>' +
        '<button onclick="closeChatModal()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">' + icon('x','w-4 h-4 text-white/50') + '</button>' +
      '</div>' +
      '<div id="chat-scroll-list" class="flex-1 min-h-0 overflow-y-auto px-4 py-3">' + list + '</div>' +
      (chatErrorMsg && chatMessages.length ? '<div class="shrink-0 px-4 pb-1 text-[10px] text-rose-400">' + chatErrorMsg + '</div>' : '') +
      '<div class="shrink-0 px-4 py-3 border-t border-white/[0.06] flex items-center gap-2">' +
        '<input value="' + chatInputText.replace(/"/g,'&quot;') + '" oninput="updateChatInput(this.value)" onkeydown="if(event.key===\'Enter\'){submitChatMessage();}" placeholder="Tulis pesan..." class="flex-1 bg-[#0b1329] border border-white/10 rounded-full px-4 py-2.5 text-[13px] text-white outline-none focus:border-[#2563eb]/60">' +
        '<button onclick="submitChatMessage()" ' + (chatSendBusy?'disabled':'') + ' class="shrink-0 w-10 h-10 rounded-full bg-[#2563eb] flex items-center justify-center disabled:opacity-60">' +
          (chatSendBusy ? '<span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full spin"></span>' : icon('send','w-4 h-4 text-white')) +
        '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ==== HELPER: cari field di objek row tanpa peduli ejaan header persis
// (ID_TP vs "ID TP" vs "Id_Tp", dst) -- header sheet mentah, jangan diasumsikan pasti sama.
function getField(row, name) {
  if (!row) return '';
  const target = name.toLowerCase().replace(/[\s_]/g, '');
  for (const key in row) {
    if (key.toLowerCase().replace(/[\s_]/g, '') === target) return row[key];
  }
  return '';
}
function setField(row, name, value) {
  const target = name.toLowerCase().replace(/[\s_]/g, '');
  for (const key in row) {
    if (key.toLowerCase().replace(/[\s_]/g, '') === target) { row[key] = value; return; }
  }
  row[name] = value;
}
function sumField(rows, key) { return rows.reduce((s,r) => s + (parseFloat(r[key]) || 0), 0); }
function avgField(rows, key) { const vals = rows.map(r=>parseFloat(r[key])).filter(v=>!isNaN(v) && v>0); return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0; }

function renderErrorBanner() {

}

// ==== RENDER: VALIDASI ====
// FIX (26 Agu): 1 ID_TP di sheet Validasi punya BANYAK baris (1 baris per kedalaman
// meter yang diukur -- 1m, 2m, 3m dst). Sebelumnya tiap baris ditampilkan sbg entri
// terpisah (salah) -- sekarang dikelompokkan per ID_TP, sama persis pola dashboard
// web: kartu ringkasan pakai RATA-RATA semua kedalaman + Class Grade, detail per
// kedalaman baru dibuka lewat modal.
function numFieldGet(row, ...names) {
  for (const n of names) { const v = parseFloat(getField(row, n)); if (!isNaN(v)) return v; }
  return null;
}
function avgOf(arr) { const v = arr.filter(x => x !== null); return v.length ? (v.reduce((a,b)=>a+b,0)/v.length) : null; }
function fmt2(v) { return v === null || v === undefined || isNaN(v) ? '-' : v.toFixed(2); }

function groupValidasiByTp(rows) {
  const map = {}, order = [];
  rows.forEach(r => {
    const idTp = String(getField(r,'ID_TP')||'').trim();
    if (!idTp) return;
    if (!map[idTp]) { map[idTp] = []; order.push(idTp); }
    map[idTp].push(r);
  });
  return order.map(idTp => {
    const depths = map[idTp].slice().sort((a,b) => (numFieldGet(a,'Meter')||0) - (numFieldGet(b,'Meter')||0));
    // Field umum per-TP (Area/Bench/Timur/Utara/Warna/Struktur) biasanya cuma diisi di
    // baris kedalaman pertama -- ambil dari baris manapun yang punya nilai non-kosong.
    function pickStatic(name) { const found = depths.find(d => String(getField(d,name)||'').trim()); return found ? getField(found,name) : ''; }
    // v90.2.115 FIX (temuan audit #4 -- konflik koordinat disembunyikan): SEBELUMNYA
    // pickStatic() diam2 memilih nilai PERTAMA yg ditemukan kalau ada >1 baris kedalaman
    // dgn Timur/Utara BEDA (data rusak/salah input) -- tidak ada tanda apapun ke user.
    // Fungsi ini SAMA seperti pickStatic tapi tambah deteksi: kalau ada >1 nilai UNIK
    // non-kosong utk field yg sama, tandai conflict=true.
    function pickStaticWithConflict(name) {
      const nonEmpty = depths.map(d => String(getField(d,name)||'').trim()).filter(v => v);
      const unique = [...new Set(nonEmpty)];
      return { value: nonEmpty.length ? nonEmpty[0] : '', conflict: unique.length > 1 };
    }
    const timurResult = pickStaticWithConflict('Timur');
    const utaraResult = pickStaticWithConflict('Utara');
    const niArr = depths.map(d => numFieldGet(d,'Ni %','Ni'));
    const feArr = depths.map(d => numFieldGet(d,'Fe %','Fe'));
    const coArr = depths.map(d => numFieldGet(d,'Co %','Co'));
    const mgoArr = depths.map(d => numFieldGet(d,'MgO %','MgO'));
    const sio2Arr = depths.map(d => numFieldGet(d,'SiO2 %','SiO2'));
    const smArr = depths.map(d => numFieldGet(d,'SM %','SM'));
    const avgNi = avgOf(niArr), avgSm = avgOf(smArr);
    const tipeLateritRaw = String(pickStatic('Tipe_Laterit')||'').toLowerCase();
    const tipeOreMapped = tipeLateritRaw.indexOf('limo') >= 0 ? 'Limo' : 'Sapro';
    let classGrade = '-';
    if (avgNi !== null) { try { classGrade = classifyMaterial(avgNi, tipeOreMapped, avgSm).classGrade; } catch (e) {} }
    const depthValues = depths.map(d => numFieldGet(d,'Meter')).filter(v => v !== null);
    const maxDepth = depthValues.length ? Math.max(...depthValues) : 0;
    return {
      idTp, depths,
      blok: pickStatic('Blok'), area: pickStatic('Area'), bench: pickStatic('Bench'), timur: timurResult.value, utara: utaraResult.value,
      coordConflict: timurResult.conflict || utaraResult.conflict, // v90.2.115 (temuan #4)
      warna: pickStatic('Warna'), struktur: pickStatic('Struktur'), tipeLaterit: pickStatic('Tipe_Laterit'),
      tanggal: pickStatic('Tanggal'), pelapor: pickStatic('Pelapor'),
      avgNi, avgFe: avgOf(feArr), avgCo: avgOf(coArr), avgMgo: avgOf(mgoArr), avgSio2: avgOf(sio2Arr), avgSm,
      classGrade, depthCount: depths.length, maxDepth
    };
  });
}

// v90.2.113 BARU (Peta -- kontrak mapData): dibangun dari dataset UTUH globalValidasiFullForMap
// (bukan globalValidasiToday yg sudah kepotong 100), lalu disaring hanya field yg genuinely
// dibutuhkan Peta (poin desain #1 "field minimum") -- BUKAN seluruh baris Validasi mentah.
// Detail assay/kedalaman tetap ada (via `depths` dari groupValidasiByTp), tapi field lain yg
// tidak relevan utk visualisasi lokasi (Pelapor dkk) sengaja tidak dibawa ke object akhir ini.
function buildMapData() {
  const grouped = groupValidasiByTp(globalValidasiFullForMap);
  // v90.2.115 FIX (temuan audit #5 -- validasi numerik longgar): SEBELUMNYA
  // !isNaN(parseFloat(x)) -- parseFloat("428200ABC") = 428200 (BUKAN NaN), jadi string
  // rusak/setengah-angka lolos sbg koordinat valid. Sekarang regex ketat: SELURUH string
  // (setelah trim) harus persis format angka (boleh minus/desimal), bukan cuma AWALANNYA.
  const isStrictNumeric = (v) => /^-?\d+(\.\d+)?$/.test(String(v||'').trim());
  return grouped.map(g => ({
    idTp: g.idTp,
    blok: g.blok,
    area: g.area,
    bench: g.bench,
    timur: g.timur,
    utara: g.utara,
    tanggal: g.tanggal,
    tipeLaterit: g.tipeLaterit,
    classGrade: g.classGrade,
    avgNi: g.avgNi,
    depthCount: g.depthCount,
    maxDepth: g.maxDepth,
    depths: g.depths, // dipakai kalau marker diklik utk detail kedalaman
    coordConflict: g.coordConflict, // v90.2.115 (temuan #4) -- diteruskan apa adanya ke mapData
    // Koordinat invalid (poin desain #7/#9) -- ditandai eksplisit di sini, BUKAN di renderer,
    // supaya 1 sumber kebenaran "titik ini bisa diplot atau tidak".
    hasValidCoord: isStrictNumeric(g.timur) && isStrictNumeric(g.utara)
  }));
}

// ==== Mine Grid: geometri auto-scale (poin desain #4) ====
// Timur/Utara itu koordinat GRID tambang (Easting/Northing lokal, spt contoh PDF ArcGIS
// "Timur 428200-428300, Utara 101900-102000"), BUKAN Latitude/Longitude -- sengaja TIDAK
// dipakai di Leaflet/Google Maps. Diplot sbg scatter-plot SVG custom, auto-scale ke area
// yg tersedia berapa pun rentang koordinatnya (tidak hardcode skala tertentu).
function computeMineGridBounds(points) {
  const valid = points.filter(p => p.hasValidCoord);
  if (!valid.length) return null;
  const timurs = valid.map(p => parseFloat(p.timur));
  const utaras = valid.map(p => parseFloat(p.utara));
  let minT = Math.min(...timurs), maxT = Math.max(...timurs);
  let minU = Math.min(...utaras), maxU = Math.max(...utaras);
  // Jaga-jaga: kalau semua titik kebetulan segaris (rentang 0), beri buffer artifisial
  // supaya SVG tidak collapse jadi 1 titik/garis tak terlihat.
  if (maxT - minT < 1) { minT -= 5; maxT += 5; }
  if (maxU - minU < 1) { minU -= 5; maxU += 5; }
  // Padding 10% di tiap sisi supaya marker di tepi rentang tidak mepet ke batas SVG.
  const padT = (maxT - minT) * 0.1, padU = (maxU - minU) * 0.1;
  let effMinT = minT - padT, effMaxT = maxT + padT;
  let effMinU = minU - padU, effMaxU = maxU + padU;
  // v90.2.115 FIX (temuan audit #3 -- distorsi geometri): SEBELUMNYA rentang Timur & Utara
  // masing2 dipaksa memenuhi 320x320 SECARA INDEPENDEN -- kalau area sebenarnya tidak persegi
  // (mis. Timur 1000m x Utara 200m), peta tetap tergambar hampir persegi, jarak/bentuk relatif
  // jadi menyesatkan utk peta mining (beda dgn konsep ArcGIS asli yg mempertahankan aspect
  // ratio). Sekarang KEDUA sumbu WAJIB pakai meter-per-unit yg SAMA -- sumbu yg rentangnya
  // lebih pendek "diberi napas" (padding tambahan, di-tengah-kan), BUKAN diregangkan.
  const rangeT = effMaxT - effMinT, rangeU = effMaxU - effMinU;
  if (rangeT > rangeU) {
    const extra = (rangeT - rangeU) / 2;
    effMinU -= extra; effMaxU += extra;
  } else if (rangeU > rangeT) {
    const extra = (rangeU - rangeT) / 2;
    effMinT -= extra; effMaxT += extra;
  }
  return { minT: effMinT, maxT: effMaxT, minU: effMinU, maxU: effMaxU };
}

// Konversi 1 titik Timur/Utara -> koordinat SVG (x,y). SVG y-axis terbalik dari Utara
// (Utara makin besar = "ke atas" secara peta, tapi SVG y makin besar = "ke bawah") --
// makanya utara di-flip di rumus y.
function projectToSvg(timur, utara, bounds, viewW, viewH) {
  const rangeT = bounds.maxT - bounds.minT, rangeU = bounds.maxU - bounds.minU;
  const x = ((timur - bounds.minT) / rangeT) * viewW;
  const y = viewH - (((utara - bounds.minU) / rangeU) * viewH);
  return { x, y };
}

// ==== NORTH ARROW ENGINE -- Inverse UTM + Grid Convergence + Bearing/Distance ====
// Rumus: Snyder, "Map Projections: A Working Manual" (USGS Professional Paper 1395, 1987)
// -- domain publik, standar dipakai hampir semua konverter UTM di dunia. BUKAN disalin dari
// Avenza/library berhak cipta manapun (APK Avenza sempat dibongkar 4 Sep sbg REFERENSI
// ARSITEKTUR saja -- lihat memori proyek utk histori lengkap). Tervalidasi terhadap titik
// nyata dari project ArcGIS "Maps_TP" (Easting 397088.5/Northing 53311.5, WGS84 UTM Zone
// 52N -> Convergence -28.03 arcsec, cocok dgn 2 perhitungan manual independen + versi
// Python-nya, selisih <1 arcsec di semua metode).
function inverseUtm_(easting, northing, zone, hemisphere) {
  const a = 6378137.0;                    // WGS84 semi-major axis
  const f = 1 / 298.257223563;            // WGS84 flattening
  const k0 = 0.9996;                      // UTM scale factor standar
  const e2 = f * (2 - f);
  const e2Prime = e2 / (1 - e2);

  const falseEasting = 500000.0;
  const falseNorthing = (hemisphere === 'S') ? 10000000.0 : 0.0;
  const centralMeridian = -183.0 + zone * 6.0;

  const x = easting - falseEasting;
  const y = northing - falseNorthing;
  const M = y / k0;

  const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const mu = M / (a * (1 - e2/4 - 3*e2*e2/64 - 5*e2*e2*e2/256));

  const phi1 = mu
    + (3*e1/2 - 27*Math.pow(e1,3)/32) * Math.sin(2*mu)
    + (21*e1*e1/16 - 55*Math.pow(e1,4)/32) * Math.sin(4*mu)
    + (151*Math.pow(e1,3)/96) * Math.sin(6*mu)
    + (1097*Math.pow(e1,4)/512) * Math.sin(8*mu);

  const sinPhi1 = Math.sin(phi1), cosPhi1 = Math.cos(phi1), tanPhi1 = Math.tan(phi1);
  const C1 = e2Prime * cosPhi1 * cosPhi1;
  const T1 = tanPhi1 * tanPhi1;
  const N1 = a / Math.sqrt(1 - e2 * sinPhi1 * sinPhi1);
  const R1 = a * (1 - e2) / Math.pow(1 - e2 * sinPhi1 * sinPhi1, 1.5);
  const D = x / (N1 * k0);

  const latRad = phi1 - (N1 * tanPhi1 / R1) * (
    D*D/2
    - (5 + 3*T1 + 10*C1 - 4*C1*C1 - 9*e2Prime) * Math.pow(D,4)/24
    + (61 + 90*T1 + 298*C1 + 45*T1*T1 - 252*e2Prime - 3*C1*C1) * Math.pow(D,6)/720
  );

  const lonRad = (centralMeridian * Math.PI/180) + (
    D
    - (1 + 2*T1 + C1) * Math.pow(D,3)/6
    + (5 - 2*C1 + 28*T1 - 3*C1*C1 + 8*e2Prime + 24*T1*T1) * Math.pow(D,5)/120
  ) / cosPhi1;

  return { lat: latRad * 180/Math.PI, lon: lonRad * 180/Math.PI, centralMeridian: centralMeridian };
}

function gridConvergence_(lat, lon, centralMeridian) {
  const deltaLambda = (lon - centralMeridian) * Math.PI/180;
  const latRad = lat * Math.PI/180;
  const gammaRad = Math.atan(Math.tan(deltaLambda) * Math.sin(latRad));
  return gammaRad * 180/Math.PI;
}

// Hitung convergence utk 1 titik Timur/Utara -- dipanggil LIVE tiap render, TIDAK di-cache
// sbg konstanta global (keputusan LOCKED 4 Sep: titik lain di area yg sama BISA punya
// convergence sedikit beda, walau utk 1 situs tambang bedanya biasanya <0.01 arcsec).
function computeConvergenceForPoint_(easting, northing) {
  try {
    const geo = inverseUtm_(easting, northing, MG1_CRS_CONFIG.zone, MG1_CRS_CONFIG.hemisphere);
    const gamma = gridConvergence_(geo.lat, geo.lon, geo.centralMeridian);
    return { convergenceDeg: gamma, lat: geo.lat, lon: geo.lon, ok: true };
  } catch (e) {
    return { convergenceDeg: 0, ok: false };
  }
}

// ==== BONUS: Bearing + Distance antar 2 titik Timur/Utara (TP -> TP) ====
// Pendekatan bidang datar (planar), SAH krn jarak antar TP dlm 1 situs tambang (order
// puluhan-ratusan meter) jauh lebih kecil drpd radius bumi -- kelengkungan diabaikan tanpa
// kehilangan presisi berarti. Bearing relatif GRID NORTH (0=Utara grid, searah jarum jam).
function bearingDistanceGrid_(eastingFrom, northingFrom, eastingTo, northingTo) {
  const dE = eastingTo - eastingFrom;
  const dN = northingTo - northingFrom;
  const distance = Math.sqrt(dE*dE + dN*dN);
  let bearingDeg = Math.atan2(dE, dN) * 180/Math.PI; // atan2(Timur,Utara) -> 0=Utara, 90=Timur
  if (bearingDeg < 0) bearingDeg += 360;
  return { bearingGridDeg: bearingDeg, distanceMeters: distance };
}

// v90.2.114 BARU: skala batang GENUINELY hidup -- dihitung ulang tiap kali mapZoom berubah
// (BUKAN angka/panjang tetap). Timur/Utara sudah dikonfirmasi satuan METER (sama seperti
// contoh peta ArcGIS PKS1E). Aim ~25% lebar tampilan, dibulatkan ke angka "bersih" (1/2/5/10/
// 20/25/50/100/...) terdekat yg TIDAK melebihi target -- supaya batang selalu menunjukkan
// jarak asli yg benar pada zoom berapapun, bukan dekorasi statis.
const NICE_SCALE_METERS = [1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000];
function renderMapScaleBar(bounds) {
  if (!bounds) return '';
  const viewW = 320;
  // Total meter yg terlihat di LEBAR PENUH viewBox saat ini (viewBox menyempit saat zoom,
  // jadi meter yg terlihat pun ikut menyempit -- inilah yg bikin skala "hidup").
  const totalMetersVisible = (bounds.maxT - bounds.minT) / mapZoom;
  const target = totalMetersVisible * 0.25;
  let niceMeters = NICE_SCALE_METERS[0];
  for (const m of NICE_SCALE_METERS) { if (m <= target) niceMeters = m; else break; }
  const barWidthPercent = Math.min(60, (niceMeters / totalMetersVisible) * 100);
  return '<div class="absolute left-3 bottom-3 flex flex-col items-start gap-1">' +
    '<div class="h-[3px] rounded-full bg-white/70" style="width:' + barWidthPercent.toFixed(1) + '%; min-width:20px;"></div>' +
    '<div class="text-[9px] text-white/60 font-semibold">' + niceMeters + ' m</div>' +
  '</div>';
}

function renderMineGridSvg(points) {
  const bounds = computeMineGridBounds(points);
  const viewW = 320, viewH = 320;
  if (!bounds) return '';
  // Zoom diterapkan lewat viewBox SVG (bukan transform per-titik) -- viewBox lebih kecil
  // = area yg sama ditampilkan lebih besar (efek perbesar), digeser ke tengah supaya
  // titik yg terlihat tetap proporsional terhadap pusat, bukan menempel pojok kiri-atas.
  const zoomedW = viewW / mapZoom, zoomedH = viewH / mapZoom;
  const offX = (viewW - zoomedW) / 2, offY = (viewH - zoomedH) / 2;
  const valid = points.filter(p => p.hasValidCoord);
  let svg = '<svg viewBox="' + offX + ' ' + offY + ' ' + zoomedW + ' ' + zoomedH + '" class="w-full h-full" style="touch-action:none;">';
  // Grid garis bantu tipis (visual saja, bukan data) -- membantu orientasi skala.
  for (let i = 1; i < 4; i++) {
    const gx = (viewW / 4) * i, gy = (viewH / 4) * i;
    svg += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + viewH + '" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>';
    svg += '<line x1="0" y1="' + gy + '" x2="' + viewW + '" y2="' + gy + '" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>';
  }
  // [BONUS -- 4 Sep] Mode Ukur: garis putus-putus penghubung 2 titik terpilih, digambar
  // SEBELUM marker supaya marker tetap di atas garis (klik tetap kena marker, bukan garis).
  if (measureModeActive && measureFromIdTp && measureToIdTp) {
    const pFrom = valid.find(p => p.idTp === measureFromIdTp);
    const pTo = valid.find(p => p.idTp === measureToIdTp);
    if (pFrom && pTo) {
      const rawFrom = projectToSvg(parseFloat(pFrom.timur), parseFloat(pFrom.utara), bounds, viewW, viewH);
      const rawTo = projectToSvg(parseFloat(pTo.timur), parseFloat(pTo.utara), bounds, viewW, viewH);
      svg += '<line x1="' + rawFrom.x + '" y1="' + rawFrom.y + '" x2="' + rawTo.x + '" y2="' + rawTo.y + '" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4,3"/>';
    }
  }
  valid.forEach(p => {
    const raw = projectToSvg(parseFloat(p.timur), parseFloat(p.utara), bounds, viewW, viewH);
    const preset = getGradeColorPreset(p.classGrade);
    const fillColor = { merah:'#f43f5e', abu:'#94a3b8', kuning:'#f59e0b', biru:'#3b82f6', hijau:'#22c55e' }[
      (globalCOGConfig && globalCOGConfig['Warna_' + p.classGrade]) || GRADE_COLOR_DEFAULTS[p.classGrade] || 'abu'
    ];
    // v90.2.115 (temuan #4): TP dgn koordinat konflik ditandai cincin kuning putus-putus
    // di sekeliling marker -- visual, sebelum user tap utk lihat detail konfliknya.
    const conflictRing = p.coordConflict
      ? '<circle cx="' + raw.x + '" cy="' + raw.y + '" r="10.5" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>'
      : '';
    // [BONUS -- 4 Sep] Cincin kuning solid utk titik yg sedang dipilih di Mode Ukur --
    // beda dari conflictRing (dashed) supaya tidak ketuker maknanya.
    const measureSelectedRing = (measureModeActive && (p.idTp === measureFromIdTp || p.idTp === measureToIdTp))
      ? '<circle cx="' + raw.x + '" cy="' + raw.y + '" r="10.5" fill="none" stroke="#facc15" stroke-width="2"/>'
      : '';
    svg += '<g onclick="handleMapPointTap_(\'' + p.idTp.replace(/'/g,"\\'") + '\')" style="cursor:pointer;">' +
      conflictRing +
      measureSelectedRing +
      '<circle cx="' + raw.x + '" cy="' + raw.y + '" r="7" fill="' + fillColor + '" fill-opacity="0.25" stroke="' + fillColor + '" stroke-width="2"/>' +
      '<circle cx="' + raw.x + '" cy="' + raw.y + '" r="2.5" fill="' + fillColor + '"/>' +
      '</g>';
  });
  svg += '</svg>';
  return svg;
}

function zoomMapIn() { mapZoom = Math.min(MAP_ZOOM_MAX, mapZoom + MAP_ZOOM_STEP); render(); }
function zoomMapOut() { mapZoom = Math.max(MAP_ZOOM_MIN, mapZoom - MAP_ZOOM_STEP); render(); }
// "Crosshair" = reset tampilan ke fit-semua-titik -- BUKAN GPS lokasi user (poin desain #4,
// GPS Generic sengaja tidak dikerjakan krn tidak ada sumber Lat/Long sama sekali).
function resetMapView() { mapZoom = 1; render(); }

// [BONUS -- 4 Sep] Dispatcher tap marker: rute ke Mode Ukur ATAU buka detail seperti biasa,
// tergantung measureModeActive. Perilaku detail TP normal (openMapDetail) TIDAK diubah sama
// sekali kalau Mode Ukur tidak aktif -- 0 risiko regresi ke alur yg sudah ada.
function handleMapPointTap_(idTp) {
  if (!measureModeActive) { openMapDetail(idTp); return; }
  if (!measureFromIdTp) {
    measureFromIdTp = idTp;
  } else if (measureFromIdTp === idTp) {
    measureFromIdTp = null; // tap titik yg sama lagi = batal pilih
  } else if (!measureToIdTp) {
    measureToIdTp = idTp;
  } else {
    // Sudah ada hasil sebelumnya -- tap baru mulai ulang dari titik ini (bukan nambah titik ke-3).
    measureFromIdTp = idTp;
    measureToIdTp = null;
  }
  render();
}

function openMapDetail(idTp) { mapDetailIdTp = idTp; render(); }
function closeMapDetail() { mapDetailIdTp = null; render(); }

// ==== NORTH ARROW UI -- overlay, BUKAN bagian dari SVG koordinat/marker (keputusan LOCKED
// 4 Sep) -- supaya rotasi panah tidak ikut ke-zoom/pan bareng peta. ====
function toggleNorthInfo_() { northInfoOpen = !northInfoOpen; render(); }
function setNorthMode_(mode) {
  // Guard EKSPLISIT di JS, bukan cuma tombol disabled visual -- kalau ada yg coba panggil
  // langsung dari console/DOM manapun, tetap tidak bisa masuk mode compass yg belum siap.
  if (mode === 'compass') return;
  northMode = mode;
  render();
}
function renderNorthArrow_(bounds) {
  if (!bounds) return '';
  // Titik referensi convergence = TITIK TENGAH area yg sedang ditampilkan (bounds), BUKAN
  // 1 titik tetap/hardcode -- representatif thd area yg dilihat user saat itu. Convergence
  // berubah sangat lambat scr spasial (tervalidasi 4 Sep: titik beda ratusan meter cuma
  // beda <0.01 arcsec utk situs tambang ini) jadi TIDAK perlu dihitung per-TP individual.
  const centerE = (bounds.minT + bounds.maxT) / 2;
  const centerN = (bounds.minU + bounds.maxU) / 2;

  let rotationDeg = 0, convergenceInfo = null;
  if (northMode === 'true') {
    convergenceInfo = computeConvergenceForPoint_(centerE, centerN);
    // CATATAN JUJUR (blm di-E2E-test dgn referensi bearing lapangan sungguhan): arah rotasi
    // (tanda +/-) di bawah ini konsisten scr matematis dgn rumus gridConvergence_, TAPI
    // besarnya cuma -28 detik busur (~0.008 deg) di situs ini -- SECARA VISUAL TIDAK
    // TERLIHAT bedanya dari Grid North apapun tandanya. Kalau MG1 dipakai di situs lain yg
    // convergence-nya jauh lebih besar (lintang tinggi/jauh dari central meridian), WAJIB
    // uji ulang tanda rotasi ini terhadap bearing referensi asli sebelum dipercaya penuh.
    rotationDeg = convergenceInfo.ok ? -convergenceInfo.convergenceDeg : 0;
  }

  const modeLabel = northMode === 'grid' ? 'GRID' : (northMode === 'true' ? 'TRUE' : 'GPS');
  const arrowSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="transform:rotate(' + rotationDeg.toFixed(4) + 'deg);transition:transform .3s ease;display:block">' +
    '<path d="M12 2 L17 15 L12 11.5 L7 15 Z" fill="white"/>' +
  '</svg>';

  return '<button onclick="toggleNorthInfo_()" aria-label="Info arah Utara" class="absolute left-3 top-3 z-10 flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl bg-[#0b1329]/90 border border-white/10 active:scale-95 transition-transform">' +
    arrowSvg +
    '<span class="text-[7px] font-bold text-white/50 tracking-wide">' + modeLabel + '</span>' +
  '</button>' +
  renderNorthInfoPanel_(convergenceInfo);
}
function renderNorthInfoPanel_(convergenceInfo) {
  if (!northInfoOpen) return '';
  const rows = [];
  rows.push(['Mode', northMode === 'grid' ? 'GRID NORTH' : (northMode === 'true' ? 'TRUE NORTH' : 'COMPASS')]);
  if (northMode === 'true') {
    rows.push(['CRS', 'WGS84 / UTM ' + MG1_CRS_CONFIG.zone + MG1_CRS_CONFIG.hemisphere]);
    rows.push(['Grid Conv.', (convergenceInfo && convergenceInfo.ok) ? ((convergenceInfo.convergenceDeg >= 0 ? '+' : '') + convergenceInfo.convergenceDeg.toFixed(4) + '\u00b0') : '-']);
    rows.push(['Status', (convergenceInfo && convergenceInfo.ok) ? 'CALCULATED' : 'ERROR']);
  } else if (northMode === 'grid') {
    rows.push(['Status', 'Arah sumbu Utara grid tambang -- belum dikoreksi ke True North']);
  }
  const rowsHtml = rows.map(function(r) {
    return '<div class="flex items-start justify-between gap-2 py-1.5 border-b border-white/[0.06] last:border-0">' +
      '<span class="text-[10px] text-white/40 font-medium shrink-0">' + r[0] + '</span>' +
      '<span class="text-[11px] text-white font-bold text-right">' + r[1] + '</span>' +
    '</div>';
  }).join('');
  return '<div class="absolute left-3 top-[62px] w-[210px] z-10 rounded-xl bg-[#0b1329] border border-white/10 p-3 shadow-lg" onclick="event.stopPropagation()">' +
    '<div class="flex gap-1.5 mb-2">' +
      '<button onclick="setNorthMode_(\'grid\')" class="flex-1 py-1.5 rounded-lg text-[10px] font-bold ' + (northMode==='grid' ? 'bg-[#2563eb] text-white' : 'bg-white/[0.06] text-white/50') + '">GRID</button>' +
      '<button onclick="setNorthMode_(\'true\')" class="flex-1 py-1.5 rounded-lg text-[10px] font-bold ' + (northMode==='true' ? 'bg-[#2563eb] text-white' : 'bg-white/[0.06] text-white/50') + '">TRUE</button>' +
      '<button disabled title="Segera hadir" class="flex-1 py-1.5 rounded-lg text-[10px] font-bold bg-white/[0.03] text-white/20 cursor-not-allowed">GPS</button>' +
    '</div>' +
    rowsHtml +
    '<div class="mt-2 pt-2 border-t border-white/[0.06] text-[9px] text-white/30 leading-relaxed">Compass (GPS) -- Segera Hadir. Menunggu kalibrasi magnetometer &amp; model deklinasi magnetik utk akurasi lapangan.</div>' +
  '</div>';
}

// ==== BONUS: Banner hasil Mode Ukur (TP -> TP Bearing + Distance) ====
function renderMeasureBanner_(mapData) {
  if (!measureModeActive) return '';
  if (!measureFromIdTp) {
    return '<div class="absolute left-1/2 -translate-x-1/2 top-3 z-10 px-3 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-[10px] text-amber-300 font-bold whitespace-nowrap">Mode Ukur: tap titik pertama</div>';
  }
  if (!measureToIdTp) {
    return '<div class="absolute left-1/2 -translate-x-1/2 top-3 z-10 px-3 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-[10px] text-amber-300 font-bold whitespace-nowrap">Mode Ukur: tap titik kedua (' + measureFromIdTp + ' dipilih)</div>';
  }
  const pFrom = mapData.find(p => p.idTp === measureFromIdTp);
  const pTo = mapData.find(p => p.idTp === measureToIdTp);
  if (!pFrom || !pTo) return '';
  const bd = bearingDistanceGrid_(parseFloat(pFrom.timur), parseFloat(pFrom.utara), parseFloat(pTo.timur), parseFloat(pTo.utara));
  let bearingLabel = bd.bearingGridDeg.toFixed(1) + '\u00b0 Grid';
  if (northMode === 'true') {
    const conv = computeConvergenceForPoint_(parseFloat(pFrom.timur), parseFloat(pFrom.utara));
    if (conv.ok) {
      let trueBearing = bd.bearingGridDeg - conv.convergenceDeg;
      if (trueBearing < 0) trueBearing += 360; if (trueBearing >= 360) trueBearing -= 360;
      bearingLabel = trueBearing.toFixed(1) + '\u00b0 True';
    }
  }
  return '<div class="absolute left-1/2 -translate-x-1/2 top-3 z-10 px-3 py-2 rounded-xl bg-[#0b1329]/95 border border-amber-500/30 text-center whitespace-nowrap">' +
    '<div class="text-[9px] text-white/40 font-semibold">' + measureFromIdTp + ' &rarr; ' + measureToIdTp + '</div>' +
    '<div class="text-[13px] text-amber-300 font-bold">' + bearingLabel + ' &bull; ' + bd.distanceMeters.toFixed(1) + ' m</div>' +
  '</div>';
}

// ==== Class Grade badge -- sistem IDENTIK dgn dashboard web (renderClassGradeBadge()):
// 5 preset warna translucent+border, dibaca dari globalCOGConfig.Warna_<Grade> kalau
// Developer sudah kustomisasi lewat Settings, fallback ke default sama persis dgn master.
const GRADE_COLOR_PRESETS = {
  merah: { text: 'text-rose-400', bg: 'bg-rose-500/20', border: 'border-rose-500/30' },
  abu: { text: 'text-slate-400', bg: 'bg-slate-700/40', border: 'border-slate-600/40' },
  kuning: { text: 'text-amber-400', bg: 'bg-amber-500/20', border: 'border-amber-500/30' },
  biru: { text: 'text-blue-400', bg: 'bg-blue-500/20', border: 'border-blue-500/30' },
  hijau: { text: 'text-emerald-400', bg: 'bg-emerald-500/20', border: 'border-emerald-500/30' }
};
const GRADE_COLOR_DEFAULTS = { Waste: 'abu', LG: 'kuning', MG: 'biru', HG: 'hijau', VHG: 'hijau' };
function getGradeColorPreset(classGrade) {
  const cfg = globalCOGConfig || {};
  const colorKey = cfg['Warna_' + classGrade] || GRADE_COLOR_DEFAULTS[classGrade] || 'abu';
  return GRADE_COLOR_PRESETS[colorKey] || GRADE_COLOR_PRESETS['abu'];
}
function renderClassGradeBadge(classGrade) {
  if (classGrade === 'N/A' || !classGrade || classGrade === '-') {
    return '<span class="px-2 py-0.5 rounded-md text-[11px] bg-slate-700/40 text-slate-400 border border-slate-600/40 font-semibold">N/A</span>';
  }
  const preset = getGradeColorPreset(classGrade);
  return '<span class="px-2 py-0.5 rounded-md text-[11px] ' + preset.bg + ' ' + preset.text + ' border ' + preset.border + ' font-semibold">' + classGrade + '</span>';
}

// ==== MODAL: TAMBAH VALIDASI (input assay utk TP yang SUDAH ADA -- Member tidak
// boleh set koordinat Timur/Utara, itu wewenang Head/Developer lewat Plan. Server
// menolak otomatis kalau ID TP belum punya koordinat Plan -- pesan errornya
// ditampilkan apa adanya ke user, bukan ditutup-tutupi.) ====
let validasiFormOpen = false;
let validasiFormState = { id_tp:'', area:'', bench:'', tipe_laterit:'', warna:'', struktur:'', meter:'', catatan:'', ni:'', fe:'', co:'', mgo:'', sio2:'', sm:'' };
let validasiSubmitStatusMsg = '', validasiSubmitOk = true, validasiSubmitBusy = false;

function openValidasiForm() {
  validasiFormOpen = true;
  validasiFormState = { id_tp:'', area:'', bench:'', tipe_laterit:'', warna:'', struktur:'', meter:'', catatan:'', ni:'', fe:'', co:'', mgo:'', sio2:'', sm:'' };
  validasiSubmitStatusMsg = '';
  render();
}
function closeValidasiForm() { validasiFormOpen = false; render(); }
function updateValidasiField(name, val) { validasiFormState[name] = val; render(); }

async function submitValidasiEntry() {
  const f = validasiFormState;
  if (!f.id_tp || !f.area) {
    validasiSubmitStatusMsg = 'ID TP dan Area wajib diisi.'; validasiSubmitOk = false; render(); return;
  }
  if (!f.meter) {
    validasiSubmitStatusMsg = 'Kedalaman (m) wajib dipilih -- 1 s/d 5 meter sesuai prosedur.'; validasiSubmitOk = false; render(); return;
  }
  validasiSubmitBusy = true; validasiSubmitStatusMsg = ''; render();
  try {
    const payload = buildAuthenticatedPayload({
      sheet_name: 'Validasi',
      tanggal: todayDateStr(),
      id_tp: f.id_tp, area: f.area, bench: f.bench,
      tipe_laterit: f.tipe_laterit, warna: f.warna, struktur: f.struktur,
      meter: f.meter, catatan: f.catatan,
      ni: f.ni, fe: f.fe, co: f.co, mgo: f.mgo, sio2: f.sio2, sm: f.sm
      // Timur/Utara SENGAJA tidak dikirim -- server otomatis pakai koordinat Plan
      // yang sudah ditetapkan Head/Developer utk ID TP ini.
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      validasiSubmitStatusMsg = 'Data Validasi berhasil disimpan!'; validasiSubmitOk = true; render();
      setTimeout(async () => { validasiFormOpen = false; await loadRingkasanData(); }, 800);
    } else {
      throw new Error(result.message || 'Gagal menyimpan data Validasi.');
    }
  } catch (err) {
    // Pesan error server (mis. "TP belum memiliki koordinat Plan...") ditampilkan
    // APA ADANYA -- ini bukan bug, itu memang aturan backend yg wajib dipatuhi.
    validasiSubmitStatusMsg = err.message || 'Terjadi kesalahan saat menyimpan.'; validasiSubmitOk = false;
  }
  validasiSubmitBusy = false;
  render();
}

      (validasiSubmitBusy ? '<span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full spin"></span>' : icon('save','w-4 h-4')) +

// paralel (sheet=member utk Tonase/Ni/Waste/Grade/Absensi, sheet=kpiscore utk 5 Pilar +
// Skor Gabungan), threshold warna SAMA (>=90 emerald, >=70 amber, else rose).

let kpiScoreData = null; // dari sheet=kpiscore: {final_score, weight_mode, safety_gate, pilar_laporan_tepat_waktu, pilar_kehadiran, pilar_safety, pilar_kelengkapan_sampling, pilar_attitude}

// Sama persis logika getLocalPeriodeYyyyMm() di scripts/helpers.js Master (disederhanakan
// -- Android app tidak punya state regionalTimeSettings, default Asia/Jakarta langsung).
function getLocalPeriodeYyyyMm_() {
  const d = new Date();
  try {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit' }).formatToParts(d);
    const map = {}; parts.forEach(p => { map[p.type] = p.value; });
    if (map.year && map.month) return map.year + '-' + map.month;
  } catch (e) { /* fallback */ }
  return String(d.getFullYear()) + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
// Sama persis threshold warna di modules/member.js Master.
function kpiScoreColorClass_(score) {
  if (score === null || score === undefined) return 'text-white/40';
  return score >= 90 ? 'text-[#22c55e]' : (score >= 70 ? 'text-amber-400' : 'text-rose-400');
}

async function fetchKpiScoreOnly_() {
  if (!sessionInfo) return;
  try {
    const periode = getLocalPeriodeYyyyMm_();
    const url = GOOGLE_SCRIPT_READ_URL + '?sheet=kpiscore&member_id=' + encodeURIComponent(sessionInfo.userName) + '&periode=' + periode + '&t=' + Date.now();
    const response = await fetchWithTimeout(url, {}, 20000);
    const result = await response.json();
    if (result.status === 'success' && result.data) { kpiScoreData = result.data; kpiScoreErrorMsg = ''; }
    else { kpiScoreData = null; kpiScoreErrorMsg = result.message || 'Skor KPI 5 Pilar belum tersedia.'; }
  } catch (err) {
    kpiScoreData = null;
    kpiScoreErrorMsg = 'Gagal memuat skor KPI 5 Pilar.';
  }
}

async function submitJsaConfirm(status) {
  if (!sessionInfo) { openLoginModal(); return; }
  jsaSubmitBusy = true; jsaSubmitStatusMsg = ''; render();
  try {
    const payload = buildAuthenticatedPayload({
      action: 'addJsaLog', jsa_no: JSA_DOC_NO, attendance_status: status,
      apd_helm: jsaApdChecked.helm ? 'Y' : 'N',
      apd_masker: jsaApdChecked.masker ? 'Y' : 'N',
      apd_sarung_tangan: jsaApdChecked.sarung_tangan ? 'Y' : 'N',
      apd_rompi: jsaApdChecked.rompi ? 'Y' : 'N'
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      if (result.denied) {
        jsaSubmitStatusMsg = result.message || 'Kehadiran Anda sudah tercatat hari ini.';
        jsaSubmitOk = true;
        jsaConfirmedToday = true;
      } else {
        jsaSubmitStatusMsg = 'Kehadiran (' + status + ') berhasil dikonfirmasi!';
        jsaSubmitOk = true;
        jsaConfirmedToday = true;
        await refreshKpiOnly(); // sinkron langsung -- Absensi Hadir/Izin/Cuti di KPI ikut update
      }
    } else {
      jsaSubmitStatusMsg = result.message || 'Gagal mengonfirmasi kehadiran.';
      jsaSubmitOk = false;
    }
  } catch (err) {
    jsaSubmitStatusMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
    jsaSubmitOk = false;
  }
  jsaSubmitBusy = false;
  render();
}

  issueModalOpen = true; issueLoading = true; issueErrorMsg = ''; issueFormOpen = false;
  render();
  try {
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL + '?sheet=issue&t=' + Date.now());
    const result = await response.json();
    if (result.status === 'error') {
      issueErrorMsg = result.message || 'Server menolak permintaan data Issue.';
      issueListData = [];
    } else {
      issueListData = (result.data || []).slice().reverse();
    }
  } catch (err) {
    issueErrorMsg = 'Tidak bisa menghubungi server: ' + (err && err.message ? err.message : String(err));
    issueListData = [];
  }
  issueLoading = false;
  render();
}
function closeIssueModal() { issueModalOpen = false; render(); }
function openIssueForm() {
  issueFormOpen = true;
  issueFormState = { masalah:'', lokasi:'', dampak:'', rekomendasi:'', pic:'', target:'', status:'Open' };
  issueSubmitStatusMsg = '';
  render();
}
function closeIssueForm() { issueFormOpen = false; render(); }
function updateIssueField(name, val) { issueFormState[name] = val; render(); }

async function submitIssueEntry() {
  const f = issueFormState;
  if (!f.masalah || !f.lokasi || !f.pic) {
    issueSubmitStatusMsg = 'Masalah, Lokasi, dan PIC wajib diisi.'; issueSubmitOk = false; render(); return;
  }
  issueSubmitBusy = true; issueSubmitStatusMsg = ''; render();
  try {
    const now = new Date();
    const payload = buildAuthenticatedPayload({
      sheet_name: 'Masalah & Rekomendasi',
      tanggal: todayDateStr(),
      waktu: now.toTimeString().slice(0,5),
      masalah: f.masalah, lokasi: f.lokasi, dampak: f.dampak,
      rekomendasi: f.rekomendasi, pic: f.pic, target: f.target, status: f.status
    });
    const response = await fetchWithTimeout(GOOGLE_SCRIPT_READ_URL, { method: 'POST', body: payload }, 20000);
    const result = await response.json();
    if (result.status === 'success') {
      issueSubmitStatusMsg = 'Issue berhasil disimpan!'; issueSubmitOk = true; render();
      setTimeout(async () => { issueFormOpen = false; await openIssueModal(); }, 800);
    } else {
      throw new Error(result.message || 'Gagal menyimpan issue.');
    }
  } catch (err) {
    issueSubmitStatusMsg = err.message || 'Terjadi kesalahan saat menyimpan.'; issueSubmitOk = false;
  }
  issueSubmitBusy = false;
  render();
}

// ==== MENU AKUN (dipicu dari avatar header) ====
// ==== BARU (27 Agu): FOTO PROFIL LOKAL -- Member pilih foto dari galeri Android,
// disimpan di localStorage HP itu SENDIRI (base64, dikompres dulu via canvas supaya
// hemat kuota), kunci disimpan per Login_ID (bukan 1 kunci global) supaya kalau ganti
// akun di HP yang sama, fotonya tidak tertukar. TIDAK PERNAH terupload ke server --
// murni preferensi lokal per perangkat. Karena PWA (bukan app native), app TIDAK BISA
// otomatis tahu kalau foto aslinya dihapus dari galeri Android -- makanya disediakan
// tombol "Copot Foto" di dalam app sebagai satu-satunya cara pasti menghapusnya.
function getCustomAvatarStorageKey() {
  const loginId = (localStorage.getItem('mine_member_login_id') || 'guest').trim();
  return 'mine_member_avatar_custom_' + loginId;
}
function getCustomAvatarDataUrl() {
  try { return localStorage.getItem(getCustomAvatarStorageKey()) || ''; } catch (e) { return ''; }
}
function getMemberInitials() {
  const name = (sessionInfo && sessionInfo.userName) ? sessionInfo.userName.trim() : '';
  if (!name) return '';
  return name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function handleAvatarFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  const statusEl = document.getElementById('avatar-status-msg');
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    if (statusEl) { statusEl.textContent = 'File yang dipilih bukan gambar.'; statusEl.className = 'text-[10px] mt-2 text-rose-400'; statusEl.classList.remove('hidden'); }
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // Kompres + resize ke maksimal 256x256 sebelum disimpan -- foto asli dari kamera
      // HP modern bisa >5MB, jauh melebihi kuota localStorage (~5-10MB total per app).
      const canvas = document.createElement('canvas');
      const maxSize = 256;
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
      else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
      try {
        localStorage.setItem(getCustomAvatarStorageKey(), compressedDataUrl);
        if (statusEl) { statusEl.textContent = 'Foto tersimpan di HP ini.'; statusEl.className = 'text-[10px] mt-2 text-emerald-400'; statusEl.classList.remove('hidden'); }
        render();
      } catch (err) {
        if (statusEl) { statusEl.textContent = 'Gagal menyimpan -- ruang penyimpanan HP penuh.'; statusEl.className = 'text-[10px] mt-2 text-rose-400'; statusEl.classList.remove('hidden'); }
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = ''; // reset supaya bisa pilih file yg sama lagi kalau mau
}
function removeCustomAvatar() {
  try { localStorage.removeItem(getCustomAvatarStorageKey()); } catch (e) {}
  render();
}

let _prevModalSnapshot = {};
function _computeJustOpenedModals() {
  const snap = {
    updateAssay: !!updateAssayModalOpen,
    login: !!loginModalOpen,
    chat: !!chatModalOpen,
    diggingDetail: !!diggingDetailOpen,
    validasiDetail: !!validasiDetailOpen,
    validasiForm: !!validasiFormOpen,
    report: !!reportModalOpen,
    kpi: !!kpiModalOpen,
    jsa: !!jsaModalOpen,
    settings: !!settingsModalOpen,
    issue: !!issueModalOpen,
    digging: !!diggingModalOpen,
    mapDetail: !!mapDetailIdTp
  };
  const justOpened = {};
  for (const key in snap) justOpened[key] = snap[key] && !_prevModalSnapshot[key];
  _prevModalSnapshot = snap;
  return justOpened;
}

  html += renderKpiModal(justOpened.kpi);
  html += renderJsaModal(justOpened.jsa);
  html += renderIssueModal(justOpened.issue);
  html += renderChatModal(justOpened.chat);
  html += renderValidasiDetailModal(justOpened.validasiDetail);
  html += renderDiggingDetailModal(justOpened.diggingDetail);
  html += renderUpdateAssayModal(justOpened.updateAssay);
  html += renderValidasiFormModal(justOpened.validasiForm);
  html += renderReportModal(justOpened.report);
  html += renderSettingsModal(justOpened.settings);
  app.innerHTML = html;

  const loginForm = document.getElementById('login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', function(ev) {
      ev.preventDefault();
      const loginId = document.getElementById('login-id-input').value.trim();
      const email = document.getElementById('login-email-input').value.trim();
      const pin = document.getElementById('login-pin-input').value.trim();
      loginBusy = true; render();
      submitLogin(loginId, email, pin, (msg, ok, busy) => {
        loginStatusMsg = msg; loginStatusOk = ok; loginBusy = !!busy;
        if (!busy) render();
      }).finally(() => { loginBusy = false; });
    });
  }
}

// BARU (27 Agu): daftarkan Service Worker -- Member App sekarang PWA sungguhan,
// bisa di-install ke homescreen Android, ikon+nama ikut manifest.json (share
// assets/ dgn dashboard utama). Gagal daftar (mis. browser lama) tidak boleh
// menghentikan app -- app tetap jalan normal tanpa PWA kalau SW gagal.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('Gagal mendaftarkan Service Worker Member App:', err);
    });
  });
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('app').innerHTML = renderSplash();
  if (window.lucide) lucide.createIcons();
  setTimeout(async () => {
    const stored = loadStoredSession();
    if (stored) sessionInfo = stored; // kalau kebetulan ada sesi lama tersimpan, tetap dipakai
    // FIX (27 Agu): splash TIDAK boleh langsung diganti Ringkasan sebelum data beneran
    // siap -- sebelumnya render() dipanggil DULUAN di sini, jadi user sempat lihat
    // Ringkasan kosong (0 Ton dkk) sesaat sebelum data asli masuk, dikira error/rusak.
    // loadRingkasanData() sendiri SUDAH memanggil render() di baris terakhirnya begitu
    // data selesai (sukses ATAU gagal) -- splash otomatis tetap tampil sampai saat itu,
    // tidak perlu render() terpisah di sini lagi.
    await loadRingkasanData();
  }, 900);
});
</script>
